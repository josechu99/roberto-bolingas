<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daddys Games</title>
<meta name="description" content="Los juegos del grupo: La vida de Roberto Bolingas y La Fuga de Pedorreta.">
<meta name="theme-color" content="#14101c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=VT323&family=Chango&family=Nunito:wght@700;800&display=swap">
<style>
/* Portada: título arcade arriba y dos máquinas, cada una vestida como su propio juego */
:root{
  --bg:#14101c; --ink:#f6efe4; --dim:#a99db6; --gold:#ffc247;
  /* Roberto */
  --cave:#150e1d; --stone:#261b31; --stone2:#3a2b48; --neon:#ff4f8b;
  /* Pedorreta */
  --sky:#bfe4f6; --sky2:#8fd0f0; --navy:#1d2a3f; --gas:#7cae1e; --brick:#c4553a; --panel:#fffaf0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  background-image:radial-gradient(circle at 50% -10%,#3a2550 0,transparent 55%);
  padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:22px;-webkit-tap-highlight-color:transparent}
header{text-align:center;display:grid;gap:6px;margin-top:6px}
h1{font-family:"Bungee",Impact,sans-serif;font-weight:400;margin:0;line-height:.95;
  font-size:clamp(40px,12vw,84px);letter-spacing:.01em;color:var(--gold);
  text-shadow:0 4px 0 #9c2453,0 8px 0 #4a1530,0 0 30px rgba(255,79,139,.35)}
h1 span{display:block;color:var(--ink);font-size:.62em;letter-spacing:.18em;text-shadow:0 3px 0 #9c2453}
.sub{margin:0;color:var(--dim);font-weight:700;font-size:15px}
.cabinets{width:100%;max-width:860px;display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:720px){.cabinets{grid-template-columns:1fr 1fr}}
.cab{position:relative;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;text-decoration:none;
  min-height:300px;transition:transform .15s ease,box-shadow .15s ease}
.cab:active{transform:translateY(3px)}
.cab:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
@media (hover:hover){.cab:hover{transform:translateY(-4px)}}
.art{position:relative;flex:1;min-height:210px;overflow:hidden}
.info{padding:14px 16px 16px;display:grid;gap:8px}
.play{justify-self:start;border-radius:999px;padding:10px 20px}

/* ---- Roberto: cueva del Chapandaz, pixel art y neón ---- */
.rob{background:var(--cave);color:#f3eadf;box-shadow:0 6px 0 #0a0710,0 0 0 3px var(--stone2) inset}
.rob .art{background:linear-gradient(#1d1428,#2a1d37)}
.rob .art::before{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:var(--stone);
  clip-path:polygon(0 0,100% 0,100% 40%,95% 100%,90% 35%,83% 80%,76% 30%,70% 100%,63% 40%,55% 75%,48% 30%,41% 100%,35% 35%,28% 70%,21% 30%,14% 95%,8% 40%,3% 70%,0 35%)}
.rob .sign{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-family:"Press Start 2P",monospace;font-size:11px;color:var(--neon);
  text-shadow:0 0 8px var(--neon),0 0 18px rgba(255,79,139,.6);white-space:nowrap;animation:flick 3.2s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%,96%{opacity:.35}}
.rob .bar{position:absolute;left:0;right:0;bottom:0;height:46px;background:#3a2b48;border-top:6px solid #4b3a5c}
.rob .sprite{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);height:170px;image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.4))}
.rob .info{background:var(--stone)}
.rob h2{font-family:"Press Start 2P",monospace;font-weight:400;font-size:14px;line-height:1.6;margin:0;color:var(--neon)}
.rob h2 b{font-weight:400;color:var(--gold)}
.rob p{margin:0;font-family:"VT323",monospace;font-size:21px;line-height:1.05;color:#c9bcd6}
.rob .play{font-family:"Press Start 2P",monospace;font-size:11px;background:var(--neon);color:#1a0712;border-radius:4px;box-shadow:0 4px 0 #9c2453}

/* ---- Pedorreta: cielo de Madrid, ladrillo y gas ---- */
.ped{background:var(--panel);color:var(--navy);box-shadow:0 6px 0 var(--navy),0 0 0 3px var(--navy) inset}
.ped .art{background:linear-gradient(var(--sky),var(--sky2))}
.ped .sun{position:absolute;top:22px;right:26px;width:58px;height:58px;border-radius:50%;background:#fff3b5;box-shadow:0 0 0 10px rgba(255,243,181,.35)}
.ped .city{position:absolute;left:0;right:0;bottom:30px;height:120px;display:flex;align-items:flex-end;gap:6px;padding:0 6px}
.ped .city i{--c:var(--brick);flex:1;border-radius:2px 2px 0 0;border-top:5px solid rgba(0,0,0,.18);
  background:linear-gradient(90deg,var(--c) 0 16%,transparent 16% 40%,var(--c) 40% 60%,transparent 60% 84%,var(--c) 84%) 0 8px/100% 100% no-repeat,
             linear-gradient(var(--c) 0 30%,#f4e3b8 30% 72%,var(--c) 72%) 0 8px/100% 20px,var(--c)}
.ped .city i:nth-child(1){height:70%}.ped .city i:nth-child(2){height:100%;--c:#b04a33}
.ped .city i:nth-child(3){height:55%;--c:#d9a77a}.ped .city i:nth-child(4){height:85%}
.ped .city i:nth-child(5){height:62%;--c:#b04a33}
.ped .ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:#e3c48d;border-top:6px solid #f0dcae}
.ped .runner{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);height:178px;filter:drop-shadow(0 6px 0 rgba(29,42,63,.25))}
.ped .puff{position:absolute;bottom:62px;left:calc(50% - 98px);width:26px;height:26px;border-radius:50%;background:var(--gas);opacity:.75;
  box-shadow:-20px 10px 0 -4px var(--gas),-36px -4px 0 -8px var(--gas);animation:puff 2.4s ease-in-out infinite}
@keyframes puff{50%{transform:translate(-6px,-6px) scale(1.12);opacity:.55}}
.ped .info{border-top:3px solid var(--navy)}
.ped h2{font-family:"Chango","Arial Black",sans-serif;font-weight:400;font-size:24px;line-height:1;margin:0}
.ped h2 b{font-weight:400;color:var(--gas)}
.ped p{margin:0;font-size:15px;line-height:1.35;font-weight:700;color:#3b4a63}
.ped .play{font-family:"Chango","Arial Black",sans-serif;font-size:16px;background:var(--gas);color:#fff;border:3px solid var(--navy);box-shadow:0 4px 0 #3d5a0a}

footer{color:var(--dim);font-size:13px;font-weight:700;text-align:center}
@media (prefers-reduced-motion:reduce){.rob .sign,.ped .puff{animation:none}.cab{transition:none}}
</style>
</head>

<style>

 .sqbody{display:block;overflow:visible}.sqgrid{overflow:visible;padding:10px 16px;grid-template-columns:repeat(2,minmax(0,1fr))}.sqdet{padding:10px 16px}
 .sqfoot{position:sticky;bottom:0;padding:10px 16px}}

/* ===== Capa visual "vistosa" ===== */
body{background:radial-gradient(1200px 600px at 15% -10%,#2b3a2c 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#3a1820 0,transparent 55%),var(--bg);background-attachment:fixed}
header h1{background:linear-gradient(180deg,#fff2b8,#f4d35e 55%,#d79a2b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6e1424) drop-shadow(0 6px 10px rgba(0,0,0,.5))}

button{box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s,filter .12s}

button{background-image:linear-gradient(180deg,#ffe58a,#f4d35e 50%,#e2b53c)}

.box{background:linear-gradient(180deg,#2a3029,#20251f);border-color:#3f463b;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}

lor:#f07a8c\">DERROTA</div><h3>Yuyu aplastó a la resistencia</h3><p>No les queda ni una zona en Orcasitas. El barrio sigue bajo la dictadura, pero no olvida.</p>\n      <div class=\"btns\"><button id=\"nc\">Nueva campaña</button></div>", "Yuyu se ha atrincherado en la estación de Renfe de Orcasitas para escapar en el Cercanías. Está en el andén del fondo, al otro lado de las vías, con tres sargentos y sus esbirros. Cruzad el vestíbulo, pasad los tornos y las vías, y acabad con él. Si cae, Orcasitas es libre. ": "Yuyu se atrincheró en la estación de Renfe de Orcasitas para escapar en el tren suburbano. Está en el andén del fondo, al otro lado de las vías, con tres sargentos y sus esbirros. Crucen el vestíbulo, pasen los torniquetes y las vías, y acaben con él. Si cae, Orcasitas es libre. ", "Yuyu ha requisado la pista de pickleball del final de la calle Gainza. Maetin y dos colegas suyos del Decathlon siguen jugando dentro como si nada, pero los esbirros de Yuyu, con su sargento, vigilan la pista. Si llevas a Dani, puede liarles con una partida de pickleball para que bajen la guardia.": "Yuyu requisó la cancha de pickleball del final de la calle Gainza. Maetin y dos compas suyos del Decathlon siguen jugando adentro como si nada, pero los esbirros de Yuyu, con su sargento, vigilan la cancha. Si llevas a Dani, puede distraerlos con una partida de pickleball para que bajen la guardia.", "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>Yuyu sigue atrincherado en la estación</h3><p>La moral baja 1. Recuperaos, liberad más zonas o saboteadle la casa y volved a intentarlo.</p>\n      <p class=\"muted\">Al hospital {1} turno{2}: {3}.</p><div class=\"btns\"><button id=\"bk\">Volver al mapa</button></div>": "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>Yuyu sigue atrincherado en la estación</h3><p>La moral baja 1. Recupérense, liberen más zonas o sabotéenle la casa y vuelvan a intentarlo.</p>\n      <p class=\"muted\">Al hospital {1} turno{2}: {3}.</p><div class=\"btns\"><button id=\"bk\">Volver al mapa</button></div>", "Los esbirros de Yuyu han tomado el Parque de Pradolongo: la fuente circular, las pistas azules y el jardín de setos. En un banco de la zona de tierra está Safu dándose el lote con su ligue, a lo suyo. Si llegas a su lado, montará un numerito tan exagerado que los esbirros no podrán dejar de mirar, y os dejarán pasar.": "Los esbirros de Yuyu tomaron el Parque de Pradolongo: la fuente circular, las canchas azules y el jardín de setos. En una banca de la zona de tierra está Safu besuqueándose con su ligue, en lo suyo. Si llegas a su lado, armará un numerito tan exagerado que los esbirros no podrán dejar de mirar, y los dejarán pasar.", "Los esbirros de Yuyu vigilan la Plaza Puerto de Urquiola desde los cuatro bloques blancos que la rodean. En medio de la plaza está el Faliyo con su bici tuneada, gritando que están \"bricolando\" y llamando al colega rubio. Si llegas a su lado, os pasará unas hierbas suyas que os vuelven casi invisibles para los esbirros durante unos turnos.": "Los esbirros de Yuyu vigilan la Plaza Puerto de Urquiola desde los cuatro bloques blancos que la rodean. En medio de la plaza está el Faliyo con su bici tuneada, gritando que están \"bricoleando\" y llamando al compa rubio. Si llegas a su lado, les pasará unas hierbas suyas que los vuelven casi invisibles para los esbirros durante unos turnos.", "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu ha caído en el turno {0}. Se acabaron los decretos: vuelven las cañas, el chándal y el pickleball para todos.</p>\n        <p class=\"muted\">{1} misiones ganadas.</p><div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>": "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu cayó en el turno {0}. Se acabaron los decretos: vuelven las chelas, los pants y el pickleball para todos.</p>\n        <p class=\"muted\">{1} misiones ganadas.</p><div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>", "Yuyu ha puesto a sus esbirros a entrenar en las barritas, entre los bloques de pisos junto a la Avenida de los Poblados. En un sillón abandonado en la calle están Wilson y Harold, a su rollo y con sus latas. Si llegas a su lado, les tiran latas de cerveza a los esbirros, y dos de ellos acabarán llevándoselos detenidos: dos esbirros menos para vosotros.": "Yuyu puso a sus esbirros a entrenar en las barras, entre los bloques de departamentos junto a la Avenida de los Poblados. En un sillón abandonado en la calle están Wilson y Harold, en lo suyo y con sus latas. Si llegas a su lado, les avientan latas de cerveza a los esbirros, y dos de ellos acabarán llevándoselos detenidos: dos esbirros menos para ustedes.", "Yuyu ha cerrado las urgencias del 12 de Octubre para sus esbirros. Delante de la entrada está Juanma con su perrazo, buscando a quién darle la chapa. Ojo: si te acercas a su zona (la marca amarilla), te la suelta a ti y pierdes el turno. Pero desde un poco más lejos puedes llamarle para que se la dé a dos esbirros, que se quedarán distraídos toda la misión.": "Yuyu cerró urgencias del 12 de Octubre para sus esbirros. Delante de la entrada está Juanma con su perrote, buscando a quién echarle un sermón. Ojo: si te acercas a su zona (la marca amarilla), te lo suelta a ti y pierdes el turno. Pero desde un poco más lejos puedes llamarle para que se lo eche a dos esbirros, que se quedarán distraídos toda la misión.", "<p>Yuyu en persona, con su guardia, en su casa.</p>\n        <div class=\"sabs\">{0}</div>\n        <p class=\"muted\">{1}</p>\n        <p class=\"muted\">Yuyu se ha atrincherado en la estación de Renfe de Orcasitas para huir en el Cercanías. El asalto final es allí.</p>\n        <div class=\"btns\"><button class=\"red\" id=\"craid\" {2}>🕵️ Incursión: sabotear</button></div>": "<p>Yuyu en persona, con su guardia, en su casa.</p>\n        <div class=\"sabs\">{0}</div>\n        <p class=\"muted\">{1}</p>\n        <p class=\"muted\">Yuyu se atrincheró en la estación de Renfe de Orcasitas para huir en el tren suburbano. El asalto final es allí.</p>\n        <div class=\"btns\"><button class=\"red\" id=\"craid\" {2}>🕵️ Incursión: sabotear</button></div>", "En la Plaza de la Asociación, junto al Centro Cultural de la Meseta, Félix López está dando un mitin sobre los cubos de basura y las cosas que hace Yuyu. A Yuyu no le gusta nada y manda esbirros para reventarlo, y seguirá mandando más durante la misión. La gente del mitin está con vosotros: los esbirros que se acerquen a la multitud se llevarán una lluvia de tomates.": "En la Plaza de la Asociación, junto al Centro Cultural de la Meseta, Félix López está dando un mitin sobre los botes de basura y las cosas que hace Yuyu. A Yuyu no le gusta nada y manda esbirros para reventarlo, y seguirá mandando más durante la misión. La gente del mitin está con ustedes: los esbirros que se acerquen a la multitud se llevarán una lluvia de jitomates.", "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu ha caído en el andén de la estación de Orcasitas, en el turno {0}, sin llegar a subirse al Cercanías.{1} Se acabaron los decretos: vuelven las cañas, el chándal y el pickleball para todos.</p>\n        {2}<div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>": "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu cayó en el andén de la estación de Orcasitas, en el turno {0}, sin alcanzar a subirse al tren suburbano.{1} Se acabaron los decretos: vuelven las chelas, los pants y el pickleball para todos.</p>\n        {2}<div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>", "Yuyu se ha quedado con todo el material del Decathlon de Usera. En la puerta de la tienda está Maetin: el que llegue a su lado se lleva una bici con la que atropellar a un esbirro, y vale para cada uno del escuadrón que llegue. En el aparcamiento anda Danilo, que se pondrá a ligar con los esbirros que se le acerquen cuando le dé por ahí (como mucho con dos), y esos se olvidarán de pelear.": "Yuyu se quedó con todo el material del Decathlon de Usera. En la puerta de la tienda está Maetin: el que llegue a su lado se lleva una bici con la que atropellar a un esbirro, y vale para cada uno del escuadrón que llegue. En el estacionamiento anda Danilo, que se pondrá a ligar con los esbirros que se le acerquen cuando se le antoje (como mucho con dos), y esos se olvidarán de pelear.", "Los esbirros han okupado la casa de Jotechno, junto a los Jardines de Orcasitas y el Centro de Mayores. En el cruce de caminos hay una lona azul que tapa el pozo de mierda: si llevas a Jose, puede tirar de ella cuando haya esbirros encima. En el parque infantil está la nevera de Jotechno con las croquetas de su madre: quien llegue gana +2 de vida máxima, pero el sargento la vigila de cerca.": "Los esbirros okuparon la casa de Jotechno, junto a los Jardines de Orcasitas y el Centro de Mayores. En el cruce de caminos hay una lona azul que tapa el pozo de caca: si llevas a Jose, puede jalarla cuando haya esbirros encima. En el parque infantil está el refri de Jotechno con las croquetas de su mamá: quien llegue gana +2 de vida máxima, pero el sargento lo vigila de cerca.", "Os coláis en la casa del dictador para debilitarlo antes del asalto final. Está más vigilada que nunca. Hay tres sabotajes posibles, marcados en amarillo: el cuadro eléctrico de la cocina (apagón por Cortilandia), el buzón de la entrada (lluvia de cartas de moroso) y el móvil de Yuyu en la mesilla del dormitorio (llamada a Irene). Pon a alguien al lado y pulsa el botón. Lo que sabotees se queda hecho aunque te retires. Si lo haces todo, salís corriendo con la misión cumplida.": "Se cuelan en la casa del dictador para debilitarlo antes del asalto final. Está más vigilada que nunca. Hay tres sabotajes posibles, marcados en amarillo: el tablero eléctrico de la cocina (apagón por las luces navideñas), el buzón de la entrada (lluvia de cartas de moroso) y el celular de Yuyu en el buró del dormitorio (llamada a Irene). Pon a alguien al lado y presiona el botón. Lo que sabotees se queda hecho aunque te retires. Si lo haces todo, salen corriendo con la misión cumplida.", "{0}<div class=\"zbody\">\n      <p>Yuyu se ha atrincherado en la estación de Renfe con su guardia para huir en el Cercanías. Si cae, Orcasitas es libre.</p>\n      <div class=\"tiles\"><div class=\"tile {1}\"><small>Zonas</small><b>{2}/{3}</b></div><div class=\"tile y\"><small>Ventajas</small><b>{4}</b></div></div>\n      <div class=\"prog\"><i style=\"width:{5}%\"></i></div>\n      <p>{6}</p>\n      <div class=\"sabs\">{7}\n      {8}</div>\n      <div class=\"btns\"><button class=\"red\" id=\"cfin\" {9}>🚆 Asalto final</button></div></div>": "{0}<div class=\"zbody\">\n      <p>Yuyu se atrincheró en la estación de Renfe con su guardia para huir en el tren suburbano. Si cae, Orcasitas es libre.</p>\n      <div class=\"tiles\"><div class=\"tile {1}\"><small>Zonas</small><b>{2}/{3}</b></div><div class=\"tile y\"><small>Ventajas</small><b>{4}</b></div></div>\n      <div class=\"prog\"><i style=\"width:{5}%\"></i></div>\n      <p>{6}</p>\n      <div class=\"sabs\">{7}\n      {8}</div>\n      <div class=\"btns\"><button class=\"red\" id=\"cfin\" {9}>🚆 Asalto final</button></div></div>", "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">ÚLTIMA HORA DESDE ORCASITAS</div>\n    <h3 style=\"color:#6e1424\">Yuyu se ha hecho con el barrio</h3>\n    <p>Ha tomado las Torres, el Decathlon, el Pickleball y hasta la Parrilla Gaucha. Desde su casa dicta decretos absurdos y sus esbirros vigilan cada calle.</p>\n    <p>La resistencia se organiza: elige dónde montar el cuartel, libera el barrio zona a zona, mejora al escuadrón y aguanta los contraataques. Cuando controléis 5 zonas, podréis asaltar la estación de Renfe de Orcasitas, donde Yuyu se ha atrincherado. Cada zona liberada os dará una ventaja en esa batalla final, y saboteando su casa le dejaréis más débil.</p>\n    <div class=\"opt tutq\"><b>¿Primera vez?</b> Safu y Adri te enseñan a jugar en una cita rápida de 3 minutos. Es opcional: puedes hacerlo cuando quieras desde el botón «Tutorial» del Diario.</div>\n    <div class=\"btns\"><button class=\"red\" id=\"st\">Empezar la campaña</button><button class=\"alt\" id=\"stt\">🎓 Hacer el tutorial</button></div></div>": "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">ÚLTIMA HORA DESDE ORCASITAS</div>\n    <h3 style=\"color:#6e1424\">Yuyu se adueñó del barrio</h3>\n    <p>Tomó las Torres, el Decathlon, el Pickleball y hasta la Parrilla Gaucha. Desde su casa dicta decretos absurdos y sus esbirros vigilan cada calle.</p>\n    <p>La resistencia se organiza: elige dónde montar el cuartel, libera el barrio zona a zona, mejora al escuadrón y aguanta los contraataques. Cuando controlen 5 zonas, podrán asaltar la estación de Renfe de Orcasitas, donde Yuyu se atrincheró. Cada zona liberada les dará una ventaja en esa batalla final, y saboteando su casa lo dejarán más débil.</p>\n    <div class=\"opt tutq\"><b>¿Primera vez?</b> Safu y Adri te enseñan a jugar en una cita rápida de 3 minutos. Es opcional: puedes hacerlo cuando quieras desde el botón «Tutorial» del Diario.</div>\n    <div class=\"btns\"><button class=\"red\" id=\"st\">Empezar la campaña</button><button class=\"alt\" id=\"stt\">🎓 Hacer el tutorial</button></div></div>", "<button class=\"alt mini qx\" id=\"hx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">CÓMO SE JUEGA</div><h3>La reconquista en 6 pasos</h3>\n    <ol class=\"how\"><li><b>Elige tu cuartel.</b> Cada zona da una ventaja distinta. Yuyu nunca ataca tu cuartel.</li>\n      <li><b>Ataca zonas vecinas.</b> El número del mapa son los esbirros que hay: cuanto más esperes, más manda Yuyu.</li>\n      <li><b>Combate por turnos.</b> Cada personaje tiene 2 acciones. Ponte a cubierto (escuditos), flanquea y usa los poderes.</li>\n      <li><b>Mejora en el Cuartel.</b> Con euros y material compras botiquines, puntería, zapatillas… Y el escuadrón sube de rango con la experiencia.</li>\n      <li><b>Defiende el barrio.</b> Yuyu contraataca tus zonas: refuérzalas con vecinos. Sus decretos los puedes obedecer o desafiar.</li>\n      <li><b>Asalto final.</b> Con 5 zonas se abre la estación de Renfe. Cada zona liberada y cada sabotaje en la Casa de Yuyu te ayuda.</li></ol>\n    <div class=\"btns\"><button id=\"hok\">Entendido</button><button class=\"alt\" id=\"htut2\">🎓 Mejor, el tutorial</button></div>": "<button class=\"alt mini qx\" id=\"hx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">CÓMO SE JUEGA</div><h3>La reconquista en 6 pasos</h3>\n    <ol class=\"how\"><li><b>Elige tu cuartel.</b> Cada zona da una ventaja distinta. Yuyu nunca ataca tu cuartel.</li>\n      <li><b>Ataca zonas vecinas.</b> El número del mapa son los esbirros que hay: entre más esperes, más manda Yuyu.</li>\n      <li><b>Combate por turnos.</b> Cada personaje tiene 2 acciones. Ponte a cubierto (escuditos), flanquea y usa los poderes.</li>\n      <li><b>Mejora en el Cuartel.</b> Con euros y material compras botiquines, puntería, tenis… Y el escuadrón sube de rango con la experiencia.</li>\n      <li><b>Defiende el barrio.</b> Yuyu contraataca tus zonas: refuérzalas con vecinos. Sus decretos los puedes obedecer o desafiar.</li>\n      <li><b>Asalto final.</b> Con 5 zonas se abre la estación de Renfe. Cada zona liberada y cada sabotaje en la Casa de Yuyu te ayuda.</li></ol>\n    <div class=\"btns\"><button id=\"hok\">Entendido</button><button class=\"alt\" id=\"htut2\">🎓 Mejor, el tutorial</button></div>", "<div class=\"hgrid\">\n    <div class=\"hposter\"><div class=\"rays\"></div><div class=\"hframe\"><canvas id=\"yuyuBig\"></canvas></div>\n

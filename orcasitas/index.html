ă alătur grupului pentru totdeauna. Cu iubita, dacă mă lasă.", "<div class=\"btns\"><button class=\"blue\" id=\"cjm\" {0}>Llamar a Juanma</button></div>{1}": "<div class=\"btns\"><button class=\"blue\" id=\"cjm\" {0}>Cheamă-l pe Juanma</button></div>{1}", "El escuadrón entra entre los bloques. Los esbirros vigilan las barras y los jardines.": "Echipa intră printre blocuri. Scutierii păzesc barele și grădinile.", "Maetin y sus colegas lanzan pelotas de pickleball: 2 de daño a 3 esbirros al empezar.": "Maetin și amicii lui aruncă mingi de pickleball: 2 daune la 3 scutieri la început.", "El escuadrón llega al final de la calle Gainza. Los esbirros de Yuyu vigilan la pista.": "Echipa ajunge la capătul străzii Gainza. Scutierii lui Yuyu păzesc terenul.", "El escuadrón se cuela por la puerta de la Casa de Yuyu. Hay guardias por todas partes.": "Echipa se strecoară pe ușa Casei lui Yuyu. Sunt gărzi peste tot.", "El pozo de mierda lanza una onda: {0} pringado{1}. Los esbirros se quedan con náuseas.": "Groapa cu rahat trimite o undă: stropiți: {0}. Scutierilor li se face greață.", "Toca un esbirro a tiro: si el dardo acierta, se duerme 2 turnos o hasta que le peguen.": "Atinge un scutier în bătaie: dacă săgeata nimerește, doarme 2 ture sau până e lovit.", " Sueño {0}/4: al llegar a 4 se duerme un turno; las latas azules del mapa lo espabilan.": " Somn {0}/4: la 4 adoarme o tură; dozele albastre de pe hartă îl trezesc.", "El escuadrón entra por la calle Unidad. Los esbirros vigilan los Jardines de Orcasitas.": "Echipa intră pe strada Unidad. Scutierii păzesc Grădinile Orcasitas.", "Maetin trae bicis del Decathlon: todo el escuadrón empieza con una bici para atropellar.": "Maetin aduce biciclete de la Decathlon: toată echipa începe cu o bicicletă de călcat scutieri.", "Adri monta un escándalo público: se encara con {0} y {1} esbirro{2} se queda{3} flipando.": "Adri face un scandal public: sare la {0} și scutieri șocați: {1}.", "Las incursiones son opcionales: cada sabotaje deja a Yuyu más débil para el asalto final.": "Incursiunile sunt opționale: fiecare sabotaj îl lasă pe Yuyu mai slab pentru asaltul final.", "Los vecinos del mitin vienen al andén y tiran tomates a los esbirros cercanos cada turno.": "Vecinii de la miting vin pe peron și aruncă roșii în scutierii din apropiere în fiecare tură.", "Yo entro por el lateral: sonrisa, una frase y número apuntado. Flanco y crítico, siempre.": "Eu intru din lateral: zâmbet, o replică și număr salvat. Flanc și critic, mereu.", "Los esbirros de Yuyu han tomado el parque. Entre árboles, bancos y el lago, toca echarlos.": "Scutierii lui Yuyu au ocupat parcul. Printre copaci, bănci și lac, e vremea să-i alungăm.", "<p class=\"muted\">Acércate a 6 casillas de Juanma (sin entrar en su zona) para llamarle.</p>": "<p class=\"muted\">Apropie-te la 6 căsuțe de Juanma (fără să intri în zona lui) ca să-l chemi.</p>", "Detrás del seto, como cuando me escondo de la del martes porque ha aparecido la del jueves.": "În spatele gardului viu, ca atunci când mă ascund de cea de marți pentru că a apărut cea de joi.", "Félix López da un mitin en la Plaza de la Asociación. Los esbirros de Yuyu rodean la plaza.": "Félix López ține un miting în Piața Asociației. Scutierii lui Yuyu înconjoară piața.", "Yuyu ha cerrado las urgencias para sus esbirros. Hay que recuperar la entrada del hospital.": "Yuyu a închis urgențele pentru scutierii lui. Trebuie recuperată intrarea spitalului.", "Fuentes del barrio hablan de un grupo de vecinos dispuestos a todo. Yuyu se ríe… de momento.": "Surse din cartier vorbesc de un grup de vecini gata de orice. Yuyu râde… deocamdată.", "Juanma se lleva a {0} esbirro{1} y les suelta la chapa: se quedan distraídos toda la misión.": "Juanma ia {0} scutier(i) deoparte și le ține predica: sunt distrași toată misiunea.", "Toca hacia dónde apuntar: onda de 6 casillas, 2-3 de daño a todos sin importar la cobertura.": "Atinge unde țintești: undă de 6 căsuțe, 2–3 daune tuturor, indiferent de acoperire.", "{0}\n    <div class=\"btns\"><button class=\"{1}\" id=\"cqb2\">🏠 Abrir el cuartel{2}</button></div>": "{0}\n    <div class=\"btns\"><button class=\"{1}\" id=\"cqb2\">🏠 Deschide cartierul general{2}</button></div>", "Toca una casilla: aparecen las chicas y los esbirros a 3 casillas van hacia ellas sin atacar.": "Atinge o căsuță: apar fetele și scutierii la 3 căsuțe merg după ele fără să atace.", "Desde las torres los esbirros vigilan todo el barrio. Entre los bloques hay que ir con cuidado.": "Din turnuri, scutierii supraveghează tot cartierul. Printre blocuri trebuie mers cu grijă.", "La guardia de Yuyu busca a un tal Maetin. El Faliyo dice que no conoce a ningún «colega rubio».": "Garda lui Yuyu îl caută pe un oarecare Maetin. Faliyo zice că nu cunoaște niciun «amic blond».", "Un uso: toca una casilla y la furgoneta del súper cruza esa fila o columna entera, 4-5 de daño.": "O folosire: atinge o căsuță și duba supermarketului traversează tot rândul sau coloana, 4–5 daune.", "Como en una cita: te acercas con estilo y la rematas. Aunque yo nunca necesito la segunda acción.": "Ca la o întâlnire: te apropii cu stil și dai lovitura. Deși mie nu-mi trebuie niciodată a doua acțiune.", "Yuyu ha puesto a sus esbirros a entrenar en las barritas. Toca demostrar quién está más en forma.": "Yuyu și-a pus scutierii să se antreneze la bare. E timpul să arătăm cine e mai în formă.", "¡Esbirros de Yuyu! Mira cómo miran el móvil… seguro que alguno es el ex de alguna de mis matches.": "Scutierii lui Yuyu! Uite cum se holbează în telefon… sigur unul e fostul vreunei potriviri de-ale mele.", "Rapidito, Safu, que tengo tres citas esta tarde y una me acaba de escribir «¿dónde estás, guapo?».": "Repede, Safu, am trei întâlniri în după-amiaza asta și una tocmai mi-a scris «unde ești, frumosule?».", "Con el buzón petado, Yuyu se comunica peor: sus esbirros no se avisan entre ellos y llegan 2 menos.": "Cu cutia poștală plină, Yuyu comunică mai prost: scutierii nu se anunță între ei și vin cu 2 mai puțini.", "Ahora yo. Toca mi ficha abajo, o a mí en el mapa, y llévame detrás de la caseta, a la casilla marcada.": "Acum eu. Atinge-mi fișa de jos, sau pe mine pe hartă, și du-mă în spatele cabinei, pe căsuța marcată.", "Desde su cuartel en {0}, la resistencia avanza turno a turno. Yuyu, según su entorno, «está nervioso».": "Din cartierul general din {0}, rezistența avansează tură cu tură. Yuyu, spun apropiații, «e nervos».", "El Faliyo os pasa sus hierbas: durante 3 turnos los esbirros no os ven salvo que estéis pegados a ellos.": "Faliyo vă dă ierburile lui: 3 ture scutierii nu vă văd decât dacă sunteți lipiți de ei.", "Toca una casilla: nube 3x3 durante 2 turnos. Los esbirros fallan muchísimo al disparar a través de ella.": "Atinge o căsuță: nor 3x3 timp de 2 ture. Scutierii ratează groaznic când trag prin el.", "Yuyu se ha quedado con todo el material del Decathlon. Entre los coches del aparcamiento, a recuperarlo.": "Yuyu a luat tot echipamentul de la Decathlon. Printre mașinile din parcare, să-l recuperăm.", "<button class=\"red big\" id=\"hcont\">▶ Continuar<small>Turno {0} · {1} zona{2} liberada{3}</small></button>": "<button class=\"red big\" id=\"hcont\">▶ Continuă<small>Tura {0} · {1} zone eliberate</small></button>", "La casa del dictador. No se conquista: se sabotea para debilitarle antes del asalto final en la estación.": "Casa dictatorului. Nu se cucerește: se sabotează ca să-l slăbească înainte de asaltul final din gară.", "El escuadrón llega por el aparcamiento de abajo. Los esbirros vigilan los patios y la entrada de urgencias.": "Echipa vine prin parcarea de jos. Scutierii păzesc curțile și intrarea la urgențe.", "<button class=\"red big\" id=\"hcont\">▶ Continuar la misión<small>{0} · turno {1} de la misión</small></button>": "<button class=\"red big\" id=\"hcont\">▶ Continuă misiunea<small>{0} · tura {1} din misiune</small></button>", "El escuadrón llega por la calle Lesaca. Desde los bloques, los esbirros vigilan la Plaza Puerto de Urquiola.": "Echipa vine pe strada Lesaca. Din blocuri, scutierii păzesc Piața Puerto de Urquiola.", "La chapa de por qué no tener novia: los esbirros a 3 casillas solo pueden moverse o atacar durante 2 turnos.": "Predica despre de ce să nu ai iubită: scutierii la 3 căsuțe pot doar să se miște sau să atace 2 ture.", "Un uso: Safu convence a un esbirro normal a 4 casillas o menos para que se cambie de bando. Lo controlas tú.": "O folosire: Safu convinge un scutier obișnuit la 4 căsuțe să treacă de partea voastră. Îl controlezi tu.", "Los esbirros se están comiendo toda la carne de la parrilla. Entre mesas y sillas de la terraza, a por ellos.": "Scutierii mănâncă toată carnea de pe grătar. Printre mesele și scaunele de pe terasă, după ei!", "Yuyu contraataca tus zonas: refuérzalas con vecinos. Y a veces saca decretos absurdos: obedeces o te rebelas.": "Yuyu îți contraatacă zonele: întărește-le cu vecini. Și uneori dă decrete absurde: te supui sau te revolți.", "<span class=\"res warn\"><span class=\"ri\">🚫</span><div><small>Toque de queda</small><b>{0} turno</b></div></span>": "<span class=\"res warn\"><span class=\"ri\">🚫</span><div><small>Interdicție</small><b>{0} tură</b></div></span>", "El escuadrón llega por la calle de Gainza. Los esbirros se están poniendo morados en la terraza de la Parrilla.": "Echipa vine pe strada Gainza. Scutierii se îndoapă pe terasa de la Parrilla.", "Toca a Adri y luego a un esbirro: el número amarillo es la probabilidad de acertar. Después pulsa «Tirar lata».": "Atinge-l pe Adri și apoi un scutier: numărul galben e șansa de a nimeri. Apoi apasă «Aruncă doza».", "<p><b>{0} se une al grupo:</b> a partir de ahora viene siempre con el escuadrón, además de los 4 que elijas.</p>": "<p><b>{0} se alătură grupului:</b> de acum vine mereu cu echipa, pe lângă cei 4 pe care îi alegi.</p>", "El escuadrón cruza la Avenida de los Poblados. En el parque, los esbirros vigilan la fuente, las pistas y el jardín.": "Echipa traversează Avenida de los Poblados. În parc, scutierii păzesc fântâna, terenurile și grădina.", "Safu monta un numerito en el banco: {0} esbirro{1} no pueden dejar de mirar durante 2 turnos. ¡Aprovechad para pasar!": "Safu își face numărul pe bancă: scutieri care nu se pot opri din holbat 2 ture: {0}. Treceți acum!", "⚠️ <b>Yuyu prepara un ataque contra {0}</b>: llega en {1} turnos con fuerza {2}. Ahora tiene defensa {3}: refuérzala.": "⚠️ <b>Yuyu pregătește un atac asupra {0}</b>: vine peste {1} ture cu forța {2}. Acum are apărarea {3}: întărește-o.", "Irene vuelve de Cullera y le echa la bronca en plena batalla: Yuyu empieza con menos vida y a veces se queda sin turno.": "Irene se întoarce din Cullera și îl ceartă în plină bătălie: Yuyu începe cu mai puțină viață și uneori își pierde tura.", "Las barritas de encima son la vida: si llega a cero, ese personaje se va al hospital unos turnos. Ahora, acaba con ellos.": "Barele de deasupra sunt viața: dacă ajunge la zero, personajul ajunge la spital câteva ture. Acum, terminați-i.", "Ahora, el mapa de Orcasitas. Las zonas rojas son de Yuyu: puedes atacar las que tocan con las tuyas, las del borde dorado.": "Acum, harta Orcasitas. Zonele roșii sunt ale lui Yuyu: le poți ataca pe cele vecine cu ale tale, cele cu margine aurie.", "Solo en su casa, un uso: Jose tira de la lona del pozo (a 5 casillas o menos) y los esbirros que estén encima caen dentro.": "Doar la el acasă, o folosire: Jose trage prelata de pe groapă (la cel mult 5 căsuțe) și scutierii de deasupra cad înăuntru.", "Wilson y Harold acribillan a latas de cerveza a dos esbirros, que se los llevan detenidos. ¡Dos esbirros menos en la zona!": "Wilson și Harold ciuruiesc doi scutieri cu doze de bere, iar ăștia sunt luați pe sus, arestați. Cu doi scutieri mai puțin în zonă!", "El escuadrón llega por el descampado. Los esbirros vigilan la tienda, el aparcamiento y las manzanas de la calle del Simca.": "Echipa vine prin maidan. Scutierii păzesc magazinul, parcarea și blocurile de pe strada Simca.", "Safu se lleva a {0} esbirro{1} a darles una clase del manual de la putología. No vuelven en toda la misión, y Safu tampoco.": "Safu ia {0} scutier(i) deoparte pentru o lecție din manualul crailor. Nu se mai întorc toată misiunea, nici Safu.", "¡Bienvenido a la academia de Safu! Hoy aprendes a zurrar a los esbirros de Yuyu… y de paso, a ligar como los profesionales.": "Bine ai venit la academia lui Safu! Azi înveți să-i bați pe scutierii lui Yuyu… și, pe deasupra, să agăți ca profesioniștii.", "La bici que te ha dejado Maetin: te lanzas contra un esbirro a 7 casillas o menos y lo atropellas (4-5 de daño). Un solo uso.": "Bicicleta de la Maetin: te arunci asupra unui scutier la cel mult 7 căsuțe și îl calci (4–5 daune). O singură folosire.", "<div class=\"zhead {0}\"><div class=\"eyebrow\">{1}</div><h2>{2}</h2>{3}<button class=\"zup\" onclick=\"toMap()\">▲ Mapa</button></div>": "<div class=\"zhead {0}\"><div class=\"eyebrow\">{1}</div><h2>{2}</h2>{3}<button class=\"zup\" onclick=\"toMap()\">▲ Hartă</button></div>", "<div class=\"tile r\"><small>Ataque de Yuyu</small><b>⚔️ {0}</b></div><div class=\"tile r\"><small>Llega en</small><b>{1} t.</b></div>": "<div class=\"tile r\"><small>Atacul lui Yuyu</small><b>⚔️ {0}</b></div><div class=\"tile r\"><small>Vine peste</small><b>{1} t.</b></div>", "<div class=\"tfoot\"><span class=\"tstep\">{0}</span><span class=\"tbtns\"><button class=\"alt\" id=\"tskip\">Saltar</button>{1}</span></div>": "<div class=\"tfoot\"><span class=\"tstep\">{0}</span><span class=\"tbtns\"><button class=\"alt\" id=\"tskip\">Sari peste</button>{1}</span></div>", "<p>Elige desde qué zona empezáis a reconquistar Orcasitas. Cada una da una ventaja distinta. La Casa de Yuyu no se puede elegir.</p>": "<p>Alege zona din care începeți recucerirea Orcasitas. Fiecare dă un alt avantaj. Casa lui Yuyu nu poate fi aleasă.</p>", "Ha llegado el momento: Yuyu en persona espera en su despacho, al fondo de la casa, rodeado de su guardia. Si cae, Orcasitas es libre. ": "A sosit momentul: Yuyu în persoană așteaptă în birou, în fundul casei, înconjurat de gardă. Dacă el cade, Orcasitas e liber. ", "{0}<div class=\"zbody\">\n      {1}{2}{3}\n      <div class=\"btns\"><button class=\"red\" id=\"cstart\" {4}>⚑ Empezar aquí</button></div></div>": "{0}<div class=\"zbody\">\n      {1}{2}{3}\n      <div class=\"btns\"><button class=\"red\" id=\"cstart\" {4}>⚑ Începe aici</button></div></div>", "Cuando no te queden acciones, pulsa «Fin del turno». «Vigilancia» deja a alguien atento: si un esbirro se mueve a la vista, le dispara.": "Când nu mai ai acțiuni, apasă «Termină tura». «Pânda» ține pe cineva atent: dacă un scutier se mișcă la vedere, trage.", "Cada turno ganas vecinos, euros y material. En el Cuartel compras mejoras: botiquín, puntería, zapatillas… Yo ya vengo mejorado de serie.": "În fiecare tură câștigi vecini, euro și material. La cartierul general cumperi îmbunătățiri: trusă, țintire, adidași… Eu vin îmbunătățit din fabrică.", "Prueba mis Chicas de Tinder: vienen todas por mí y los esbirros se van detrás de ellas. O mi Escándalo público, que cuando la lío, la lío.": "Încearcă Fetele de pe Tinder: vin toate după mine și scutierii aleargă după ele. Sau Scandalul public, că atunci când o iau razna, o iau razna de-adevăratelea.", "Si pillas a uno por un lado donde no le tapa nada, sale «FLANCO»: aciertas más y puedes hacer crítico. Como en el bar: nunca se entra de frente.": "Dacă prinzi unul dintr-o parte unde nu-l acoperă nimic, apare «FLANC»: nimerești mai des și poți da critic. Ca la bar: niciodată nu intri din față.", "Un uso: Safu alecciona a los 3 esbirros normales más cercanos (5 casillas). Se quedan escuchándole toda la misión: los 4 desaparecen del combate.": "O folosire: Safu le ține lecția celor mai apropiați 3 scutieri obișnuiți (5 căsuțe). Rămân să-l asculte toată misiunea: toți 4 ies din luptă.", "Esto va por turnos. Cada uno tiene 2 acciones: los puntitos azules de su ficha. Moverse gasta 1; atacar o usar un poder gasta todo lo que te quede.": "Se joacă pe ture. Fiecare are 2 acțiuni: bulinele albastre de pe fișă. Mișcarea costă 1; atacul sau o putere consumă tot ce ți-a rămas.", "<h2>{0}</h2><p>{1}</p>\n      {2}\n      <div class=\"btns\"><button id=\"go\" {3}>Confirmar</button><button class=\"alt\" id=\"cancel\">Cancelar</button></div>": "<h2>{0}</h2><p>{1}</p>\n      {2}\n      <div class=\"btns\"><button id=\"go\" {3}>Confirmă</button><button class=\"alt\" id=\"cancel\">Anulează</button></div>", "Toca hacia dónde apuntar: Maetin saca con la raqueta de tenis y la bola va botando 7 casillas. 3-4 de daño a todos los que pilla y los derriba un turno.": "Atinge unde țintești: Maetin servește cu racheta de tenis și mingea sare 7 căsuțe. 3–4 daune tuturor pe care îi atinge și îi doboară o tură.", "<rect x=\"528\" y=\"6\" width=\"262\" height=\"56\" rx=\"8\"/><text x=\"659\" y=\"30\" class=\"rt1\">🚆 ESTACIÓN DE ORCASITAS</text><text x=\"659\" y=\"51\" class=\"rt2\">{0}</text>": "<rect x=\"528\" y=\"6\" width=\"262\" height=\"56\" rx=\"8\"/><text x=\"659\" y=\"30\" class=\"rt1\">🚆 GARA ORCASITAS</text><text x=\"659\" y=\"51\" class=\"rt2\">{0}</text>", "Eso es cobertura. Los escuditos del suelo te lo chivan: medio escudo es cobertura baja y escudo entero, cobertura alta. Detrás de algo te aciertan mucho menos.": "Asta e acoperire. Scuturile mici de pe jos te anunță: jumătate de scut e acoperire mică, scutul întreg, acoperire mare. În spatele a ceva te nimeresc mult mai rar.", "Solo en la Parrilla, dos veces: Adri silba y Jambus atropella con su patinete al esbirro que elijas (4-5 de daño). La primera vez se esconde; la segunda se larga.": "Doar la Parrilla, de două ori: Adri fluieră și Jambus îl calcă cu trotineta pe scutierul ales (4–5 daune). Prima dată se ascunde; a doua, pleacă.", "Con 5 zonas se desbloquea el asalto final en la estación de Renfe, y cada zona liberada da una ventaja para esa batalla. Como mis citas: a la quinta, la definitiva.": "Cu 5 zone se deblochează asaltul final din gara Renfe, iar fiecare zonă eliberată dă un avantaj în bătălia aceea. Ca la întâlnirile mele: a cincea e cea bună.", "Mira y aprende. Mi poder es Compadreo: me camelo a un esbirro y se pasa a nuestro bando. Elígeme, pulsa el botón azul «Compadreo» y toca al esbirro que tengo cerca.": "Privește și învață. Puterea mea e Fârtățeala: îl îmbrobodesc pe un scutier și trece de partea noastră. Alege-mă, apasă butonul albastru «Fârtățeala» și atinge scutierul de lângă mine.", "Adri ya está elegido: lleva el aro amarillo. Toca la casilla que brilla, detrás del seto. Las azules son andando; las amarillas, corriendo (gastas las dos acciones).": "Adri e deja ales: are inelul galben. Atinge căsuța care strălucește, în spatele gardului viu. Cele albastre sunt mers; cele galbene, alergare (consumi ambele acțiuni).", "Solo en esta misión, un uso: Dani le monta un partido a Maetin. Los esbirros que ven la pista se quedan mirando 2 turnos: no se mueven, apuntan fatal y pierden la cobertura.": "Doar în misiunea asta, o folosire: Dani îi organizează un meci lui Maetin. Scutierii care văd terenul se holbează 2 ture: nu se mișcă, țintesc groaznic și pierd acoperirea.", "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>{1} sigue en manos de Yuyu</h3>\n      <p>La moral baja 1 y Yuyu refuerza la zona.</p><p class=\"muted\">Al hospital {2} turno{3}: {4}.</p>": "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>{1} rămâne în mâinile lui Yuyu</h3>\n      <p>Moralul scade cu 1 și Yuyu întărește zona.</p><p class=\"muted\">La spital {2} tur(e): {4}.</p>", "Adri se vuelve loco y la lía: grita, vacila y se encara. Al esbirro más cercano le cae 2-3 de daño y lo aparta de un empujón; los demás a 3 casillas se quedan flipando y apuntan mucho peor un turno.": "Adri o ia razna și face scandal: țipă, se dă mare și sare la bătaie. Cel mai apropiat scutier ia 2–3 daune și e împins; ceilalți la 3 căsuțe rămân șocați și țintesc mult mai prost o tură.", "<div class=\"eyebrow\">MISIÓN CUMPLIDA</div><h3>¡{0} liberada!</h3>\n      <p>Recompensa: +{1} vecinos, +{2} euros, +{3} de material y +1 de moral.</p><p class=\"muted\">Ventaja nueva: {4}</p>\n      {5}{6}": "<div class=\"eyebrow\">MISIUNE ÎNDEPLINITĂ</div><h3>{0} eliberată!</h3>\n      <p>Recompensă: +{1} vecini, +{2} euro, +{3} material și +1 moral.</p><p class=\"muted\">Avantaj nou: {4}</p>\n      {5}{6}", "<div class=\"rephd\"><span class=\"tbig\">{0}</span><div><div class=\"eyebrow\">NUEVO TURNO</div><h3>Así está el barrio</h3></div></div><ul class=\"rep\">{1}</ul>\n    <div class=\"btns\"><button id=\"okT\">{2}</button></div>": "<div class=\"rephd\"><span class=\"tbig\">{0}</span><div><div class=\"eyebrow\">TURĂ NOUĂ</div><h3>Cum stă cartierul</h3></div></div><ul class=\"rep\">{1}</ul>\n    <div class=\"btns\"><button id=\"okT\">{2}</button></div>", "<div class=\"tiles\"><div class=\"tile g\"><small>Defensa</small><b>🛡️ {0}</b></div>{1}</div>\n      {2}\n      {3}{4}{5}\n      {6}\n      <div class=\"btns\"><button id=\"creinf\" {7}>🧱 Reforzar +2 · {8} vecinos</button></div>": "<div class=\"tiles\"><div class=\"tile g\"><small>Apărare</small><b>🛡️ {0}</b></div>{1}</div>\n      {2}\n      {3}{4}{5}\n      {6}\n      <div class=\"btns\"><button id=\"creinf\" {7}>🧱 Întărește +2 · {8} vecini</button></div>", "<button class=\"alt mini qx\" id=\"gx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">LA RESISTENCIA</div><h3>Conoce al escuadrón</h3>\n    <div class=\"gal\">{0}</div>\n    <div class=\"btns\"><button id=\"gok\">Cerrar</button></div>": "<button class=\"alt mini qx\" id=\"gx\" aria-label=\"Închide\">✕</button><div class=\"eyebrow\">REZISTENȚA</div><h3>Cunoaște echipa</h3>\n    <div class=\"gal\">{0}</div>\n    <div class=\"btns\"><button id=\"gok\">Închide</button></div>", "{0}<div class=\"zbody\"><p>Las zonas rojas con borde dorado se pueden atacar. En las tuyas puedes reforzar la defensa. Cada turno puedes hacer una misión; al volver, el turno avanza. Si no quieres atacar, pulsa «Terminar turno».</p></div>": "{0}<div class=\"zbody\"><p>Zonele roșii cu margine aurie pot fi atacate. În ale tale poți întări apărarea. În fiecare tură poți face o misiune; când te întorci, tura avansează. Dacă nu vrei să ataci, apasă «Termină tura».</p></div>", "<button class=\"alt mini qx\" id=\"qx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">CUARTEL DE LA RESISTENCIA</div><h3>Mejoras</h3>{0}\n    <div class=\"qgrid\">{1}</div>\n    <div class=\"btns\"><button class=\"alt\" id=\"qclose\">Cerrar</button></div>": "<button class=\"alt mini qx\" id=\"qx\" aria-label=\"Închide\">✕</button><div class=\"eyebrow\">CARTIERUL GENERAL AL REZISTENȚEI</div><h3>Îmbunătățiri</h3>{0}\n    <div class=\"qgrid\">{1}</div>\n    <div class=\"btns\"><button class=\"alt\" id=\"qclose\">Închide</button></div>", "<div class=\"tutend\"><div class=\"eyebrow\" style=\"color:#f07a8c\">CALABAZAS</div><h3>Hasta los esbirros te han dado calabazas</h3>\n    {0}{1}<div class=\"btns\"><button id=\"trep\">Repetir el tutorial</button><button class=\"alt\" id=\"tout\">Salir</button></div></div>": "<div class=\"tutend\"><div class=\"eyebrow\" style=\"color:#f07a8c\">RESPINS</div><h3>Până și scutierii ți-au dat papucii</h3>\n    {0}{1}<div class=\"btns\"><button id=\"trep\">Repetă tutorialul</button><button class=\"alt\" id=\"tout\">Ieși</button></div></div>", "<div class=\"eyebrow\" style=\"color:#f07a8c\">DERROTA</div><h3>Yuyu ha aplastado la resistencia</h3><p>No os queda ni una zona en Orcasitas. El barrio sigue bajo la dictadura, pero no olvida.</p>\n      <div class=\"btns\"><button id=\"nc\">Nueva campaña</button></div>": "<div class=\"eyebrow\" style=\"color:#f07a8c\">ÎNFRÂNGERE</div><h3>Yuyu a zdrobit rezistența</h3><p>Nu v-a mai rămas nicio zonă în Orcasitas. Cartierul rămâne sub dictatură, dar nu uită.</p>\n      <div class=\"btns\"><button id=\"nc\">Campanie nouă</button></div>", "<div class=\"tiles\"><div class=\"tile r\"><small>Esbirros</small><b>😈 {0}</b></div><div class=\"tile {1}\"><small>Dificultad</small><b>{2}</b></div></div>\n        {3}{4}{5}\n        {6}\n        <div class=\"btns\"><button class=\"red\" id=\"catt\" {7}>⚔️ {8}</button></div>": "<div class=\"tiles\"><div class=\"tile r\"><small>Scutieri</small><b>😈 {0}</b></div><div class=\"tile {1}\"><small>Dificultate</small><b>{2}</b></div></div>\n        {3}{4}{5}\n        {6}\n        <div class=\"btns\"><button class=\"red\" id=\"catt\" {7}>⚔️ {8}</button></div>", "<div class=\"tutend\" style=\"display:grid;gap:10px\"><div class=\"eyebrow\">TUTORIAL SUPERADO</div><h3>¡Primera cita superada!</h3>\n    {0}\n    {1}\n    {2}\n    {3}\n    {4}\n    <div class=\"btns\"><button class=\"red\" id=\"tgo\">¡A reconquistar Orcasitas!</button></div></div>": "<div class=\"tutend\" style=\"display:grid;gap:10px\"><div class=\"eyebrow\">TUTORIAL TERMINAT</div><h3>Prima întâlnire, reușită!</h3>\n    {0}\n    {1}\n    {2}\n    {3}\n    {4}\n    <div class=\"btns\"><button class=\"red\" id=\"tgo\">Hai să recucerim Orcasitas!</button></div></div>", "Yuyu se ha atrincherado en la estación de Renfe de Orcasitas para escapar en el Cercanías. Está en el andén del fondo, al otro lado de las vías, con tres sargentos y sus esbirros. Cruzad el vestíbulo, pasad los tornos y las vías, y acabad con él. Si cae, Orcasitas es libre. ": "Yuyu s-a baricadat în gara Renfe din Orcasitas ca să fugă cu trenul. E pe peronul din fund, dincolo de linii, cu trei sergenți și scutierii lui. Traversați holul, treceți de turnicheți și de linii și terminați-l. Dacă el cade, Orcasitas e liber. ", "<h3>¿Retirarse?</h3><p>El escuadrón vuelve al cuartel. Los que hayan caído se quedan en el hospital, la zona sigue en manos de Yuyu y la moral baja 1.</p>\n    <div class=\"btns\"><button class=\"red\" id=\"ry\">Retirarse</button><button class=\"alt\" id=\"rn\">Seguir luchando</button></div>": "<h3>Retragere?</h3><p>Echipa se întoarce la cartierul general. Cei căzuți rămân la spital, zona rămâne a lui Yuyu și moralul scade cu 1.</p>\n    <div class=\"btns\"><button class=\"red\" id=\"ry\">Retragere</button><button class=\"alt\" id=\"rn\">Continuă lupta</button></div>", "<h2>{0}</h2><p>Contra {1} ({2}/{3} de vida)</p>\n      <p><b style=\"font-family:var(--display);font-size:28px;color:var(--gold)\">{4}%</b> de acierto · {5}-{6} de daño{7}</p>\n      <div class=\"btns\"><button id=\"fire\">{8}</button><button class=\"alt\" id=\"cancel\">Cancelar</button></div>": "<h2>{0}</h2><p>Contra {1} ({2}/{3} viață)</p>\n      <p><b style=\"font-family:var(--display);font-size:28px;color:var(--gold)\">{4}%</b> șanse · {5}-{6} daune{7}</p>\n      <div class=\"btns\"><button id=\"fire\">{8}</button><button class=\"alt\" id=\"cancel\">Anulează</button></div>", "<div class=\"dhd\"><canvas id=\"dpor\"></canvas><div><b>{0}</b><span>{1}</span>{2}</div></div>\n      <div class=\"dstats\"><span>Vida <b>{3}</b></span><span>Puntería <b>{4}</b></span><span>Mov. <b>{5}</b></span></div>\n      <p class=\"muted\"><b>Ataque:</b> {6}, {7}-{8} de daño{9}.</p>\n      {10}": "<div class=\"dhd\"><canvas id=\"dpor\"></canvas><div><b>{0}</b><span>{1}</span>{2}</div></div>\n      <div class=\"dstats\"><span>Viață <b>{3}</b></span><span>Țintire <b>{4}</b></span><span>Mișc. <b>{5}</b></span></div>\n      <p class=\"muted\"><b>Atac:</b> {6}, {7}-{8} daune{9}.</p>\n      {10}", "Yuyu ha requisado la pista de pickleball del final de la calle Gainza. Maetin y dos colegas suyos del Decathlon siguen jugando dentro como si nada, pero los esbirros de Yuyu, con su sargento, vigilan la pista. Si llevas a Dani, puede liarles con una partida de pickleball para que bajen la guardia.": "Yuyu a rechiziționat terenul de pickleball de la capătul străzii Gainza. Maetin și doi amici de la Decathlon joacă înăuntru de parcă nimic nu s-ar întâmpla, dar scutierii lui Yuyu, cu sergentul lor, păzesc terenul. Dacă îl iei pe Dani, îi poate păcăli cu un meci de pickleball ca să lase garda jos.", "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>Yuyu sigue atrincherado en la estación</h3><p>La moral baja 1. Recuperaos, liberad más zonas o saboteadle la casa y volved a intentarlo.</p>\n      <p class=\"muted\">Al hospital {1} turno{2}: {3}.</p><div class=\"btns\"><button id=\"bk\">Volver al mapa</button></div>": "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>Yuyu e încă baricadat în gară</h3><p>Moralul scade cu 1. Refaceți-vă, eliberați mai multe zone sau sabotați-i casa și încercați din nou.</p>\n      <p class=\"muted\">La spital {1} tur(e): {3}.</p><div class=\"btns\"><button id=\"bk\">Înapoi la hartă</button></div>", "Los esbirros de Yuyu han tomado el Parque de Pradolongo: la fuente circular, las pistas azules y el jardín de setos. En un banco de la zona de tierra está Safu dándose el lote con su ligue, a lo suyo. Si llegas a su lado, montará un numerito tan exagerado que los esbirros no podrán dejar de mirar, y os dejarán pasar.": "Scutierii lui Yuyu au ocupat Parcul Pradolongo: fântâna rotundă, terenurile albastre și grădina cu garduri vii. Pe o bancă din zona de pământ, Safu se săruta cu iubita, în lumea lui. Dacă ajungi lângă el, face un număr atât de exagerat încât scutierii nu se vor putea uita în altă parte și vă vor lăsa să treceți.", "Los esbirros de Yuyu vigilan la Plaza Puerto de Urquiola desde los cuatro bloques blancos que la rodean. En medio de la plaza está el Faliyo con su bici tuneada, gritando que están \"bricolando\" y llamando al colega rubio. Si llegas a su lado, os pasará unas hierbas suyas que os vuelven casi invisibles para los esbirros durante unos turnos.": "Scutierii lui Yuyu păzesc Piața Puerto de Urquiola din cele patru blocuri albe din jur. În mijlocul pieței e Faliyo cu bicicleta tunată, strigând că „meșteresc” și chemându-și amicul blond. Dacă ajungi lângă el, vă dă din ierburile lui, care vă fac aproape invizibili pentru scutieri câteva ture.", "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu ha caído en el turno {0}. Se acabaron los decretos: vuelven las cañas, el chándal y el pickleball para todos.</p>\n        <p class=\"muted\">{1} misiones ganadas.</p><div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>": "<div class=\"eyebrow\">VICTORIE</div><h3>Orcasitas e liber!</h3><p>Yuyu a căzut în tura {0}. Gata cu decretele: se întorc berea, treningul și pickleball-ul pentru toți.</p>\n        <p class=\"muted\">{1} misiuni câștigate.</p><div class=\"btns\"><button id=\"nc\">Campanie nouă</button><button class=\"alt\" id=\"bk\">Vezi harta</button></div>", "\n    <span class=\"turnchip\"><small>TURNO</small><b>{0}</b></span>\n    {1}{2}{3}\n    <span class=\"res mor\" style=\"--ac:#ff9ad5\"><span class=\"ri\">✊</span><div><small>Moral</small><b>{4}{5}</b></div></span>\n    {6}\n    <span class=\"ctopbtns\"><button class=\"alt\" id=\"cqb\">🏠 Cuartel{7}</button><button class=\"red\" id=\"cend\">Terminar turno ▶</button></span>": "\n    <span class=\"turnchip\"><small>TURA</small><b>{0}</b></span>\n    {1}{2}{3}\n    <span class=\"res mor\" style=\"--ac:#ff9ad5\"><span class=\"ri\">✊</span><div><small>Moral</small><b>{4}{5}</b></div></span>\n    {6}\n    <span class=\"ctopbtns\"><button class=\"alt\" id=\"cqb\">🏠 Cartier{7}</button><button class=\"red\" id=\"cend\">Termină tura ▶</button></span>", "Yuyu ha puesto a sus esbirros a entrenar en las barritas, entre los bloques de pisos junto a la Avenida de los Poblados. En un sillón abandonado en la calle están Wilson y Harold, a su rollo y con sus latas. Si llegas a su lado, les tiran latas de cerveza a los esbirros, y dos de ellos acabarán llevándoselos detenidos: dos esbirros menos para vosotros.": "Yuyu și-a pus scutierii să se antreneze la bare, printre blocurile de lângă Avenida de los Poblados. Pe un fotoliu abandonat în stradă stau Wilson și Harold, în lumea lor, cu dozele lor. Dacă ajungi lângă ei, aruncă cu doze de bere în scutieri, iar doi dintre ei vor sfârși arestați: cu doi scutieri mai puțin pentru voi.", "Los esbirros de Yuyu se están comiendo toda la carne de La Parrilla Gaucha, entre las calles Ordicia y Gainza. Por la zona anda Jambus con su patinete, cojeando de la pierna derecha pero a toda pastilla. Si llevas a Adri, puede avisarle para que atropelle a un esbirro; después Jambus se esconde, y se le puede avisar una segunda vez antes de que se largue.": "Scutierii lui Yuyu mănâncă toată carnea de la La Parrilla Gaucha, între străzile Ordicia și Gainza. Prin zonă e Jambus cu trotineta, șchiopătând de piciorul drept dar în viteză maximă. Dacă îl iei pe Adri, îl poate chema să calce un scutier; apoi Jambus se ascunde și îl mai poți chema o dată înainte să plece.", "Yuyu ha cerrado las urgencias del 12 de Octubre para sus esbirros. Delante de la entrada está Juanma con su perrazo, buscando a quién darle la chapa. Ojo: si te acercas a su zona (la marca amarilla), te la suelta a ti y pierdes el turno. Pero desde un poco más lejos puedes llamarle para que se la dé a dos esbirros, que se quedarán distraídos toda la misión.": "Yuyu a închis urgențele de la 12 de Octubre pentru scutierii lui. În fața intrării e Juanma cu câinele lui uriaș, căutând pe cine să-l prindă la predică. Atenție: dacă te apropii de zona lui (marcajul galben), ți-o ține ție și pierzi tura. Dar de ceva mai departe îl poți chema să le-o țină la doi scutieri, care vor rămâne distrași toată misiunea.", "<p>Yuyu en persona, con su guardia, en su casa.</p>\n        <div class=\"sabs\">{0}</div>\n        <p class=\"muted\">{1}</p>\n        <p class=\"muted\">Yuyu se ha atrincherado en la estación de Renfe de Orcasitas para huir en el Cercanías. El asalto final es allí.</p>\n        <div class=\"btns\"><button class=\"red\" id=\"craid\" {2}>🕵️ Incursión: sabotear</button></div>": "<p>Yuyu în persoană, cu garda lui, acasă.</p>\n        <div class=\"sabs\">{0}</div>\n        <p class=\"muted\">{1}</p>\n        <p class=\"muted\">Yuyu s-a baricadat în gara Renfe din Orcasitas ca să fugă cu trenul. Acolo e asaltul final.</p>\n        <div class=\"btns\"><button class=\"red\" id=\"craid\" {2}>🕵️ Incursiune: sabotează</button></div>", "En la Plaza de la Asociación, junto al Centro Cultural de la Meseta, Félix López está dando un mitin sobre los cubos de basura y las cosas que hace Yuyu. A Yuyu no le gusta nada y manda esbirros para reventarlo, y seguirá mandando más durante la misión. La gente del mitin está con vosotros: los esbirros que se acerquen a la multitud se llevarán una lluvia de tomates.": "În Piața Asociației, lângă Centrul Cultural Meseta, Félix López ține un miting despre pubele și ce face Yuyu. Lui Yuyu nu-i place deloc și trimite scutieri să-l strice, și va mai trimite în timpul misiunii. Oamenii de la miting sunt cu voi: scutierii care se apropie de mulțime vor primi o ploaie de roșii.", "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu ha caído en el andén de la estación de Orcasitas, en el turno {0}, sin llegar a subirse al Cercanías.{1} Se acabaron los decretos: vuelven las cañas, el chándal y el pickleball para todos.</p>\n        {2}<div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>": "<div class=\"eyebrow\">VICTORIE</div><h3>Orcasitas e liber!</h3><p>Yuyu a căzut pe peronul gării Orcasitas, în tura {0}, fără să apuce să urce în tren.{1} Gata cu decretele: se întorc berea, treningul și pickleball-ul pentru toți.</p>\n        {2}<div class=\"btns\"><button id=\"nc\">Campanie nouă</button><button class=\"alt\" id=\"bk\">Vezi harta</button></div>", "Yuyu se ha quedado con todo el material del Decathlon de Usera. En la puerta de la tienda está Maetin: el que llegue a su lado se lleva una bici con la que atropellar a un esbirro, y vale para cada uno del escuadrón que llegue. En el aparcamiento anda Danilo, que se pondrá a ligar con los esbirros que se le acerquen cuando le dé por ahí (como mucho con dos), y esos se olvidarán de pelear.": "Yuyu a păstrat tot echipamentul de la Decathlon Usera. La ușa magazinului e Maetin: cine ajunge lângă el primește o bicicletă cu care să calce un scutier, și merge pentru fiecare din echipă care ajunge. Prin parcare umblă Danilo, care se apucă să flirteze cu scutierii care se apropie când are chef (cel mult doi), iar ăia uită de luptă.", "Los esbirros han okupado la casa de Jotechno, junto a los Jardines de Orcasitas y el Centro de Mayores. En el cruce de caminos hay una lona azul que tapa el pozo de mierda: si llevas a Jose, puede tirar de ella cuando haya esbirros encima. En el parque infantil está la nevera de Jotechno con las croquetas de su madre: quien llegue gana +2 de vida máxima, pero el sargento la vigila de cerca.": "Scutierii au ocupat casa lui Jotechno, lângă Grădinile Orcasitas și Centrul de Vârstnici. La răscrucea de alei e o prelată albastră care acoperă groapa cu rahat: dacă îl iei pe Jose, o poate trage când sunt scutieri deasupra. La locul de joacă e frigiderul lui Jotechno cu crochetele mamei lui: cine ajunge primește +2 viață maximă, dar sergentul îl păzește îndeaproape.", "Os coláis en la casa del dictador para debilitarlo antes del asalto final. Está más vigilada que nunca. Hay tres sabotajes posibles, marcados en amarillo: el cuadro eléctrico de la cocina (apagón por Cortilandia), el buzón de la entrada (lluvia de cartas de moroso) y el móvil de Yuyu en la mesilla del dormitorio (llamada a Irene). Pon a alguien al lado y pulsa el botón. Lo que sabotees se queda hecho aunque te retires. Si lo haces todo, salís corriendo con la misión cumplida.": "Vă strecurați în casa dictatorului ca să-l slăbiți înainte de asaltul final. E păzită mai bine ca oricând. Sunt trei sabotaje posibile, marcate cu galben: tabloul electric din bucătărie (pană de la luminițe), cutia poștală de la intrare (ploaie de somații) și telefonul lui Yuyu de pe noptieră (apel către Irene). Pune pe cineva lângă și apasă butonul. Ce sabotezi rămâne făcut chiar dacă te retragi. Dacă le faci pe toate, ieșiți în fugă cu misiunea îndeplinită.", "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">DECRETO DEL EXCELENTÍSIMO YUYU · TURNO {0}</div>\n    <h3 style=\"color:#6e1424\">{1}</h3>\n    <p class=\"opt\"><b>Si obedeces:</b> {2} La moral baja 1.</p>\n    <p class=\"opt\"><b>Si te rebelas:</b> la moral sube 1, pero Yuyu manda 1 esbirro más a cada zona que hace frontera contigo y adelanta su próximo ataque.</p>\n    <div class=\"btns\"><button class=\"alt\" id=\"dob\">Obedecer</button><button class=\"red\" id=\"dre\">Rebelarse</button></div></div>": "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">DECRETUL EXCELENȚEI SALE YUYU · TURA {0}</div>\n    <h3 style=\"color:#6e1424\">{1}</h3>\n    <p class=\"opt\"><b>Dacă te supui:</b> {2} Moralul scade cu 1.</p>\n    <p class=\"opt\"><b>Dacă te revolți:</b> moralul crește cu 1, dar Yuyu trimite încă un scutier în fiecare zonă vecină cu tine și își grăbește următorul atac.</p>\n    <div class=\"btns\"><button class=\"alt\" id=\"dob\">Supune-te</button><button class=\"red\" id=\"dre\">Revoltă-te</button></div></div>", "<div class=\"epi\"><div class=\"eyebrow\">EPÍLOGO</div>{0}\n    <div class=\"epl yu\"><canvas data-e=\"yuyu\"></canvas><p><b>Yuyu.</b> Irene se lo lleva de vuelta a Cullera. Dicen que ahora dicta decretos en la playa y nadie le hace caso.</p></div></div>\n    <div class=\"estats\"><div><b>{1}</b><span>turnos</span></div><div><b>{2}</b><span>misiones ganadas</span></div><div><b>{3}</b><span>zonas liberadas</span></div><div><b>{4}</b><span>sabotajes</span></div><div><b>{5}</b><span>MVP del escuadrón</span></div></div>": "<div class=\"epi\"><div class=\"eyebrow\">EPILOG</div>{0}\n    <div class=\"epl yu\"><canvas data-e=\"yuyu\"></canvas><p><b>Yuyu.</b> Irene îl ia înapoi la Cullera. Se spune că acum dă decrete pe plajă și nu-l ascultă nimeni.</p></div></div>\n    <div class=\"estats\"><div><b>{1}</b><span>ture</span></div><div><b>{2}</b><span>misiuni câștigate</span></div><div><b>{3}</b><span>zone eliberate</span></div><div><b>{4}</b><span>sabotaje</span></div><div><b>{5}</b><span>MVP-ul echipei</span></div></div>", "{0}<div class=\"zbody\">\n      <p>Yuyu se ha atrincherado en la estación de Renfe con su guardia para huir en el Cercanías. Si cae, Orcasitas es libre.</p>\n      <div class=\"tiles\"><div class=\"tile {1}\"><small>Zonas</small><b>{2}/{3}</b></div><div class=\"tile y\"><small>Ventajas</small><b>{4}</b></div></div>\n      <div class=\"prog\"><i style=\"width:{5}%\"></i></div>\n      <p>{6}</p>\n      <div class=\"sabs\">{7}\n      {8}</div>\n      <div class=\"btns\"><button class=\"red\" id=\"cfin\" {9}>🚆 Asalto final</button></div></div>": "{0}<div class=\"zbody\">\n      <p>Yuyu s-a baricadat în gara Renfe cu garda lui ca să fugă cu trenul. Dacă el cade, Orcasitas e liber.</p>\n      <div class=\"tiles\"><div class=\"tile {1}\"><small>Zone</small><b>{2}/{3}</b></div><div class=\"tile y\"><small>Avantaje</small><b>{4}</b></div></div>\n      <div class=\"prog\"><i style=\"width:{5}%\"></i></div>\n      <p>{6}</p>\n      <div class=\"sabs\">{7}\n      {8}</div>\n      <div class=\"btns\"><button class=\"red\" id=\"cfin\" {9}>🚆 Asaltul final</button></div></div>", "<div class=\"sq\">\n    <div class=\"sqhead\"><div><div class=\"eyebrow\">MISIÓN · TURNO {0}</div><h3>{1}</h3><p class=\"muted sqintro\">{2}</p>{3}</div></div>\n    <div class=\"sqteam\"><div class=\"sqlbl\">TU ESCUADRÓN <span id=\"cnt\"></span></div><div class=\"slots\" id=\"slots\"></div></div>\n    <div class=\"sqbody\"><div class=\"sqgrid\" id=\"picks\"></div><aside class=\"sqdet\" id=\"sqdet\"></aside></div>\n    <div class=\"sqfoot\"><button class=\"alt\" id=\"cancm\">Volver al mapa</button><button class=\"red big\" id=\"startm\">¡Adelante!</button></div></div>": "<div class=\"sq\">\n    <div class=\"sqhead\"><div><div class=\"eyebrow\">MISIUNE · TURA {0}</div><h3>{1}</h3><p class=\"muted sqintro\">{2}</p>{3}</div></div>\n    <div class=\"sqteam\"><div class=\"sqlbl\">ECHIPA TA <span id=\"cnt\"></span></div><div class=\"slots\" id=\"slots\"></div></div>\n    <div class=\"sqbody\"><div class=\"sqgrid\" id=\"picks\"></div><aside class=\"sqdet\" id=\"sqdet\"></aside></div>\n    <div class=\"sqfoot\"><button class=\"alt\" id=\"cancm\">Înapoi la hartă</button><button class=\"red big\" id=\"startm\">Înainte!</button></div></div>", "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">ÚLTIMA HORA DESDE ORCASITAS</div>\n    <h3 style=\"color:#6e1424\">Yuyu se ha hecho con el barrio</h3>\n    <p>Ha tomado las Torres, el Decathlon, el Pickleball y hasta la Parrilla Gaucha. Desde su casa dicta decretos absurdos y sus esbirros vigilan cada calle.</p>\n    <p>La resistencia se organiza: elige dónde montar el cuartel, libera el barrio zona a zona, mejora al escuadrón y aguanta los contraataques. Cuando controléis 5 zonas, podréis asaltar la estación de Renfe de Orcasitas, donde Yuyu se ha atrincherado. Cada zona liberada os dará una ventaja en esa batalla final, y saboteando su casa le dejaréis más débil.</p>\n    <div class=\"opt tutq\"><b>¿Primera vez?</b> Safu y Adri te enseñan a jugar en una cita rápida de 3 minutos. Es opcional: puedes hacerlo cuando quieras desde el botón «Tutorial» del Diario.</div>\n    <div class=\"btns\"><button class=\"red\" id=\"st\">Empezar la campaña</button><button class=\"alt\" id=\"stt\">🎓 Hacer el tutorial</button></div></div>": "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">ULTIMA ORĂ DIN ORCASITAS</div>\n    <h3 style=\"color:#6e1424\">Yuyu a pus mâna pe cartier</h3>\n    <p>A luat Turnurile, Decathlon-ul, terenul de Pickleball și chiar La Parrilla Gaucha. Din casa lui dă decrete absurde, iar scutierii lui păzesc fiecare stradă.</p>\n    <p>Rezistența se organizează: alege unde instalezi cartierul general, eliberează cartierul zonă cu zonă, îmbunătățește echipa și rezistă contraatacurilor. Când controlați 5 zone, puteți asalta gara Renfe din Orcasitas, unde s-a baricadat Yuyu. Fiecare zonă eliberată vă dă un avantaj în bătălia finală, iar sabotându-i casa îl veți slăbi.</p>\n    <div class=\"opt tutq\"><b>Prima dată?</b> Safu și Adri te învață să joci într-o întâlnire rapidă de 3 minute. E opțional: îl poți face oricând din butonul «Tutorial» din Jurnal.</div>\n    <div class=\"btns\"><button class=\"red\" id=\"st\">Începe campania</button><button class=\"alt\" id=\"stt\">🎓 Fă tutorialul</button></div></div>", "<button class=\"alt mini qx\" id=\"hx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">CÓMO SE JUEGA</div><h3>La reconquista en 6 pasos</h3>\n    <ol class=\"how\"><li><b>Elige tu cuartel.</b> Cada zona da una ventaja distinta. Yuyu nunca ataca tu cuartel.</li>\n      <li><b>Ataca zonas vecinas.</b> El número del mapa son los esbirros que hay: cuanto más esperes, más manda Yuyu.</li>\n      <li><b>Combate por turnos.</b> Cada personaje tiene 2 acciones. Ponte a cubierto (escuditos), flanquea y usa los poderes.</li>\n      <li><b>Mejora en el Cuartel.</b> Con euros y material compras botiquines, puntería, zapatillas… Y el escuadrón sube de rango con la experiencia.</li>\n      <li><b>Defiende el barrio.</b> Yuyu contraataca tus zonas: refuérzalas con vecinos. Sus decretos los puedes obedecer o desafiar.</li>\n      <li><b>Asalto final.</b> Con 5 zonas se abre la estación de Renfe. Cada zona liberada y cada sabotaje en la Casa de Yuyu te ayuda.</li></ol>\n    <div class=\"btns\"><button id=\"hok\">Entendido</button><button class=\"alt\" id=\"htut2\">🎓 Mejor, el tutorial</button></div>": "<button class=\"alt mini qx\" id=\"hx\" aria-label=\"Închide\">✕</button><div class=\"eyebrow\">CUM SE JOACĂ</div><h3>Recucerirea în 6 pași</h3>\n    <ol class=\"how\"><li><b>Alege-ți cartierul general.</b> Fiecare zonă dă un alt avantaj. Yuyu nu-ți atacă niciodată cartierul general.</li>\n      <li><b>Atacă zonele vecine.</b> Numărul de pe hartă arată câți scutieri sunt: cu cât aștepți mai mult, cu atât trimite Yuyu mai mulți.</li>\n      <li><b>Luptă pe ture.</b> Fiecare personaj are 2 acțiuni. Pune-te la adăpost (scuturile mici), atacă din flanc și folosește puterile.</li>\n      <li><b>Îmbunătățește la cartier.</b> Cu euro și material cumperi truse, țintire, adidași… Iar echipa crește în rang cu experiența.</li>\n      <li><b>Apără cartierul.</b> Yuyu îți contraatacă zonele: întărește-le cu vecini. Decretelor lui le poți da ascultare sau le poți sfida.</li>\n      <li><b>Asaltul final.</b> Cu 5 zone se deschide gara Renfe. Fiecare zonă eliberată și fiecare sabotaj în Casa lui Yuyu te ajută.</li></ol>\n    <div class=\"btns\"><button id=\"hok\">Am înțeles</button><button class=\"alt\" id=\"htut2\">🎓 Mai bine tutorialul</button></div>", "<div class=\"hgrid\">\n    <div class=\"hposter\"><div class=\"rays\"></div><div class=\"hframe\"><canvas id=\"yuyuBig\"></canvas></div>\n      <div class=\"hbanner\">EL LÍDER SUPREMO<br>OS VIGILA</div><div class=\"spray\">¡ABAJO<br>YUYU!</div><div class=\"stamp\">RESISTENCIA</div></div>\n    <div class=\"hmain\"><div class=\"eyebrow\">DADDYS GAMES PRESENTA</div><h1 class=\"htitle\">La Reconquista<br>de Orcasitas</h1>\n      <p class=\"htag\">Yuyu se ha hecho con el barrio. Monta la resistencia con tu escuadrón, libera Orcasitas zona a zona y échale de la estación de Renfe.</p>\n      <div class=\"hmenu\">\n        {0}\n        <button class=\"{1}\" id=\"hnew\">{2}</button>\n        <button class=\"alt\" id=\"htut\">🎓 Tutorial con Safu y Gorrón</button>\n        <div class=\"hrow\"><button class=\"alt\" id=\"hsq\">🧢 Conoce al escuadrón</button><button class=\"alt\" id=\"hhow\">📖 Cómo se juega</button><button class=\"alt\" id=\"hmus\">{3}</button></div>\n      </div></div>\n    <section class=\"hpaper\"><div class=\"ptabs\"><button class=\"ptab on\" id=\"tabEco\">📰 El Eco del Barrio</button><button class=\"ptab\" id=\"tabNov\">🆕 Novedades del juego</button></div>\n      <div id=\"hnews\"><div

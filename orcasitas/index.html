al: +2 de vida para todo el escuadrón.": "Hospital first-aid kits: +2 health for the whole squad.", "Cierran las pistas de pickleball: solo puede jugar el Líder": "Pickleball courts closed: only the Leader may play", "Danilo se pone a ligar con {0}, que se olvida de la guerra.": "Danilo starts flirting with {0}, who forgets about the war.", "El entrenamiento en casa de Jotechno os da +10 de puntería.": "Training at Jotechno's house gives you +10 aim.", "Safu se despega de su ligue y se une al grupo para siempre.": "Safu peels himself off his date and joins the group for good.", "Vienen a por nosotros. Normal, somos el centro de atención.": "They're coming for us. Fair enough, we're the centre of attention.", "Yuyu manda refuerzos, pero los vecinos del mitin os ayudan.": "Yuyu sends reinforcements, but the rally crowd helps you.", "{0} atropella a {1} con la bici del Decathlon: {2} de daño.": "{0} runs over {1} with the Decathlon bike: {2} damage.", "<div class=\"slot empty\"><span>{0}</span><em>Elige</em></div>": "<div class=\"slot empty\"><span>{0}</span><em>Pick</em></div>", "PÁNICO EN EL ANDÉN: la resistencia puede asaltar la estación": "PANIC ON THE PLATFORM: the resistance can storm the station", "Safu y Adri quedan en el parque para una clase muy especial.": "Safu and Adri meet in the park for a very special lesson.", "{z} vuelve a ser nuestro. Esta noche, cañas gratis… para mí.": "{z} is ours again. Free beer tonight… for me.", "Daniel manda fotos al grupo. {0} esbirro{1} mirando el móvil.": "Daniel sends photos to the group chat. Henchmen glued to their phones: {0}.", "En las misiones, el mapa arriba y los botones siempre a mano.": "In missions, map on top and buttons always at hand.", "Eso lo hago yo con las camareras y me sale el chupito gratis.": "I do that with waitresses and get a free shot.", "Llega en {0} turno(s) con fuerza {1}. Se recomienda reforzar.": "Arrives in {0} turn(s) with strength {1}. Reinforcing is recommended.", "Los heridos se recuperan antes y vuelven a estar disponibles.": "The wounded recover sooner and are available again.", "Quien vea a un rubio en bici, que avise. Es por su seguridad.": "Anyone who sees a blond guy on a bike, report it. It's for your safety.", "{0} se une al escuadrón. Lo controlas desde el próximo turno.": "{0} joins the squad. You control them from next turn.", "«Aquí estamos bien», declaran a este periódico, lata en mano.": "«We're fine here», they tell this paper, can in hand.", "Calabazas. Tranquilo, a Adri también le pasó una vez… en 2014.": "Rejected. Don't worry, it happened to Adri once too… in 2014.", "Loko pega una bronca: {0} esbirro{1} solo tienen ojos para él.": "Loko tears into them: henchmen who only have eyes for him: {0}.", "Los esbirros han pedido el traslado al Hospital 12 de Octubre.": "The henchmen have requested a transfer to Hospital 12 de Octubre.", "Se recuerda que el chándal es solo para el Líder los domingos.": "Reminder: tracksuits are for the Leader only on Sundays.", "Vuelve a su banco de Pradolongo con su ligue. No le molestéis.": "Back to his Pradolongo bench with his date. Don't disturb him.", "Yuyu manda más esbirros para reventar el mitin de Félix López.": "Yuyu sends more henchmen to break up Félix López's rally.", "<div class=\"btns\"><button id=\"bk\">Volver al mapa</button></div>": "<div class=\"btns\"><button id=\"bk\">Back to the map</button></div>", "Llamáis a Irene a Cullera y le contáis lo que está liando Yuyu.": "You call Irene in Cullera and tell her what Yuyu is up to.", "Tranquilo, apuntan fatal. Ni con un superlike le darían a algo.": "Relax, they can't aim. Not even with a superlike.", "Le nombran portero de la Parrilla Gaucha. Nadie entra sin pagar.": "Becomes the bouncer at La Parrilla Gaucha. Nobody gets in without paying.", "Safu aparece en el andén y deja a 2 esbirros embobados 2 turnos.": "Safu shows up on the platform and leaves 2 henchmen gawping for 2 turns.", "Un tema para cada zona, el menú, el tutorial y la batalla final.": "A theme for every zone, the menu, the tutorial and the final battle.", "«Es por la imagen del barrio», asegura el Líder desde su balcón.": "«It's for the neighbourhood's image», the Leader insists from his balcony.", "A mí no me acierta nadie… salvo Cupido. Ese no falla una conmigo.": "Nobody lands a hit on me… except Cupid. He never misses with me.", "Felicitamos al Líder por su cumpleaños. Hoy no es, pero da igual.": "We congratulate the Leader on his birthday. It isn't today, but whatever.", "Maetin deja la pala de pickleball y se une al grupo para siempre.": "Maetin puts down his pickleball paddle and joins the group for good.", "Vigilancia es lo que hacen mis ex con mis historias de Instagram.": "Overwatch is what my exes do with my Instagram stories.", "<h2>Turno de Yuyu</h2><p class=\"muted\">Los esbirros se mueven…</p>": "<h2>Yuyu's turn</h2><p class=\"muted\">The henchmen are moving…</p>", "Aquí está la base de la resistencia: Yuyu no se atreve a atacarla.": "This is the resistance's base: Yuyu doesn't dare attack it.", "Arrancáis los cables del cuadro: la casa de Yuyu se queda sin luz.": "You rip the wires out of the fuse box: Yuyu's house loses power.", "Fuentes cercanas aseguran que ya ha mirado los horarios de vuelta.": "Close sources say she's already checked the trains back.", "Jose retira la lona: {0} esbirro{1} acaba{2} en el pozo de mierda.": "Jose pulls off the tarp: henchmen in the poo pit: {0}.", "Los esbirros a 2 casillas quedan inconscientes un turno. No falla.": "Henchmen within 2 tiles are knocked out for a turn. Never misses.", "Toca una casilla azul para moverte o un esbirro con % para atacar.": "Tap a blue tile to move or a henchman with a % to attack.", "<span class=\"hos\" style=\"margin:0\">🏥 Hospital · {0} turno{1}</span>": "<span class=\"hos\" style=\"margin:0\">🏥 Hospital · {0} turn{1}</span>", "Lo de {z} es un bulo de la resistencia. Seguimos allí. Más o menos.": "The {z} story is a resistance hoax. We're still there. Sort of.", "Pedorretazone se llena de vecinos con tomates. Yuyu manda esbirros.": "Pedorretazone fills with neighbours carrying tomatoes. Yuyu sends henchmen.", "¡Atropello con la furgoneta del súper! {0} esbirro{1} arrollado{2}.": "Supermarket van run-over! Henchmen flattened: {0}.", "Llegan los bocatas de la Parrilla Gaucha: todo el escuadrón se cura.": "La Parrilla Gaucha's sandwiches arrive: the whole squad heals.", "Pincha en las fiestas de la liberación hasta las siete de la mañana.": "DJs the liberation party until seven in the morning.", "<button class=\"{0}\" data-u=\"{1}\" {2}>Comprar · 💶 {3} · 🧱 {4}</button>": "<button class=\"{0}\" data-u=\"{1}\" {2}>Buy · 💶 {3} · 🧱 {4}</button>", "Abre una academia de ligoteo en Orcasitas. Lista de espera: dos años.": "Opens a flirting academy in Orcasitas. Waiting list: two years.", "El Cercanías está reservado para emergencias del Líder. Por si acaso.": "The commuter train is reserved for the Leader's emergencies. Just in case.", "La Parrilla Gaucha, obligada a servir solo el menú favorito del Líder": "La Parrilla Gaucha forced to serve only the Leader's favourite menu", "Para colarte en su casa necesitas controlar alguna zona de alrededor.": "To sneak into his house you need to control a nearby zone.", "Si cierras el navegador, «Continuar» te devuelve justo donde estabas.": "If you close the browser, «Continue» takes you right back where you were.", "{0} asalta la nevera de Jotechno: +2 de vida máxima y se cura entero.": "{0} raids Jotechno's fridge: +2 max health and fully healed.", "El asalto final será a oscuras: los esbirros ven menos y apuntan peor.": "The final assault will be in the dark: henchmen see less and aim worse.", "Las bonificaciones de tus zonas y los sabotajes se aplican al empezar.": "Your zone bonuses and sabotages apply at the start.", "Le devuelven el carnet militar. Lo usa para colarse en los conciertos.": "Gets his military ID back. Uses it to sneak into gigs.", "Sigue contando la historia de la reconquista. Va por el capítulo tres.": "Still telling the story of the reconquest. He's on chapter three.", "Los esbirros a 5 casillas miran el móvil y apuntan mucho peor un turno.": "Henchmen within 5 tiles look at their phones and aim much worse for a turn.", "Toca una casilla: 2-3 de daño en 3x3 y náuseas (apuntan peor) un turno.": "Tap a tile: 2–3 damage in 3x3 and nausea (worse aim) for a turn.", "Gratis, un uso: hasta tu próximo turno los esbirros no le hacen ni caso.": "Free, one use: until your next turn the henchmen ignore him completely.", "Latas, collejones, el pedo nuclear, el silbato de Roberto, la furgoneta…": "Cans, slaps, the nuclear fart, Roberto's whistle, the van…", "Pedorreta enseña el carnet militar. Los esbirros no le van a decir nada.": "Pedorreta flashes his military ID. The henchmen won't say a word.", "Puma se ha quedado frito y pierde el turno. ¡Buscad bebidas energéticas!": "Puma has dozed off and loses his turn. Find energy drinks!", "Si llegas a Maetin, se une al escuadrón. Dani tiene aquí un poder extra.": "If you reach Maetin, he joins the squad. Dani has an extra power here.", "{0} le deja una bici del Decathlon a {1}: puede atropellar a un esbirro.": "{0} lends {1} a Decathlon bike: they can run over a henchman.", "+5 de puntería para todo el escuadrón y el entrenamiento cuesta la mitad.": "+5 aim for the whole squad and training costs half.", "Bocatas de la Parrilla: al final del turno 2 todo el escuadrón se cura 3.": "Parrilla sandwiches: at the end of turn 2 the whole squad heals 3.", "Jambus, en patinete y con la pierna mala, reparte los pedidos igualmente.": "Jambus, on his scooter and with a bad leg, delivers the orders anyway.", "Todo el escuadrón acierta más. A mitad de precio con las Nuevas Barritas.": "The whole squad hits more often. Half price with Nuevas Barritas.", "Entrenamiento en casa de Jotechno: +10 de puntería para todo el escuadrón.": "Training at Jotechno's house: +10 aim for the whole squad.", "Jose puede retirar la lona del pozo. En el parque infantil hay vida extra.": "Jose can pull the tarp off the pit. There's extra health in the playground.", "Los vecinos de la calle Gainza denuncian que Yuyu pierde y vuelve a sacar.": "Neighbours on Gainza street complain that Yuyu loses and serves again.", "❌ <b>Yuyu recupera {0}</b> (defensa {1} contra fuerza {2}). La moral baja.": "❌ <b>Yuyu takes back {0}</b> (defence {1} vs strength {2}). Morale drops.", "Fuentes de la estación aseguran que Yuyu lo tiene «reservado por si acaso».": "Station sources say Yuyu has it «booked just in case».", "Juanma pilla a {0} y le suelta la chapa: pierde lo que le quedaba de turno.": "Juanma corners {0} and launches into a lecture: they lose the rest of their turn.", "Los esbirros han okupado la casa de Jotechno. Hay que recuperar el cuartel.": "The henchmen have squatted Jotechno's house. We have to take back the HQ.", "Suelos con textura, sombras, árboles, fuentes y palomas en todos los mapas.": "Textured floors, shadows, trees, fountains and pigeons on every map.", "Vuelve a pitar en el barrio. Su primera tarjeta, a Yuyu, por antideportivo.": "Back to refereeing in the neighbourhood. His first card: to Yuyu, for unsporting behaviour.", "+1 de defensa en todas tus zonas y ves venir los ataques con más antelación.": "+1 defence in all your zones and you see attacks coming earlier.", "+2 de material al día. Desbloquea las zapatillas nuevas y la recarga rápida.": "+2 material a day. Unlocks new trainers and quick recharge.", "Irene ha vuelto de Cullera y está en el despacho echándole la bronca a Yuyu.": "Irene is back from Cullera and is in the office giving Yuyu a telling-off.", "Los esbirros a 4 casillas solo pueden atacarle a él un turno y apuntan peor.": "Henchmen within 4 tiles can only attack him for a turn, and aim worse.", "Cada uno tiene sus frases, Yuyu da comunicados oficiales y hay epílogo final.": "Everyone has their lines, Yuyu issues official statements and there's an ending epilogue.", "Tres sabotajes marcados en amarillo: cuadro eléctrico, buzón y móvil de Yuyu.": "Three sabotages marked in yellow: fuse box, mailbox and Yuyu's phone.", "Yuyu en persona espera en su casa con su guardia. Si cae, Orcasitas es libre.": "Yuyu himself waits at home with his guard. If he falls, Orcasitas is free.", "El territorio de Pedorreta está lleno de esbirros. Él solo no puede con todos.": "Pedorreta's turf is full of henchmen. He can't take them all on alone.", "La casa está a oscuras: solo veis lo que tenéis cerca, y los esbirros también.": "The house is dark: you only see what's near you, and so do the henchmen.", "Toca un esbirro a 4 casillas: pierde su turno escuchando, salvo que le ataquen.": "Tap a henchman within 4 tiles: it loses its turn listening, unless attacked.", "Toca una casilla: altavoz a tope, los esbirros a 2 casillas se marean 2 turnos.": "Tap a tile: speaker at full blast, henchmen within 2 tiles get dizzy for 2 turns.", "Yuyu llama a su guardia por la megafonía de la estación: llegan 2 esbirros más.": "Yuyu calls his guard over the station PA: 2 more henchmen arrive.", "Adri convoca a las chicas de Tinder. Los esbirros cercanos se olvidan de pelear.": "Adri summons the Tinder girls. Nearby henchmen forget about fighting.", "Con el buzón petado, los esbirros no se avisan entre ellos y han venido 2 menos.": "With the mailbox stuffed, the henchmen don't warn each other and 2 fewer showed up.", "Dani organiza un partido con Maetin. {0} esbirro{1} se quedan embobados mirando.": "Dani sets up a match with Maetin. Henchmen staring, hypnotised: {0}.", "Irene ha llegado desde Cullera y está en el andén, dispuesta a echarle la bronca.": "Irene has arrived from Cullera and is on the platform, ready to tell him off.", "🛡️ Los vecinos de {0} aguantan el ataque de Yuyu (defensa {1} contra fuerza {2}).": "🛡️ The neighbours of {0} hold off Yuyu's attack (defence {1} vs strength {2}).", "<p class=\"muted\">La defensa incluye los extras de las Torres y las barricadas.</p>": "<p class=\"muted\">Defence includes the Towers and barricade bonuses.</p>", "Con {0} zonas liberadas, Yuyu ha pedido que le guarden un asiento en el Cercanías.": "With {0} zones liberated, Yuyu has asked them to save him a seat on the commuter train.", "Empieza el asalto final. Yuyu espera en el andén con su guardia, junto al Cercanías.": "The final assault begins. Yuyu waits on the platform with his guard, next to the commuter train.", "Y cuando liberes Pradolongo, me uno al grupo para siempre. Con mi ligue, si me deja.": "And when you liberate Pradolongo, I join the group for good. With my date, if she lets me.", "<div class=\"btns\"><button class=\"blue\" id=\"cjm\" {0}>Llamar a Juanma</button></div>{1}": "<div class=\"btns\"><button class=\"blue\" id=\"cjm\" {0}>Call Juanma</button></div>{1}", "El escuadrón entra entre los bloques. Los esbirros vigilan las barras y los jardines.": "The squad moves in between the blocks. The henchmen guard the bars and the gardens.", "Maetin y sus colegas lanzan pelotas de pickleball: 2 de daño a 3 esbirros al empezar.": "Maetin and his mates hurl pickleballs: 2 damage to 3 henchmen at the start.", "El escuadrón llega al final de la calle Gainza. Los esbirros de Yuyu vigilan la pista.": "The squad reaches the end of Gainza street. Yuyu's henchmen guard the court.", "El escuadrón se cuela por la puerta de la Casa de Yuyu. Hay guardias por todas partes.": "The squad slips in through the door of Yuyu's House. There are guards everywhere.", "El pozo de mierda lanza una onda: {0} pringado{1}. Los esbirros se quedan con náuseas.": "The poo pit sends out a wave: splattered: {0}. The henchmen feel sick.", "Toca un esbirro a tiro: si el dardo acierta, se duerme 2 turnos o hasta que le peguen.": "Tap a henchman in range: if the dart hits, it sleeps 2 turns or until struck.", " Sueño {0}/4: al llegar a 4 se duerme un turno; las latas azules del mapa lo espabilan.": " Sleepiness {0}/4: at 4 he naps for a turn; the blue cans on the map wake him up.", "El escuadrón entra por la calle Unidad. Los esbirros vigilan los Jardines de Orcasitas.": "The squad comes in along Unidad street. The henchmen guard the Orcasitas Gardens.", "Maetin trae bicis del Decathlon: todo el escuadrón empieza con una bici para atropellar.": "Maetin brings bikes from Decathlon: the whole squad starts with a bike for running people over.", "Adri monta un escándalo público: se encara con {0} y {1} esbirro{2} se queda{3} flipando.": "Adri throws a public meltdown: he squares up to {0} and henchmen stunned: {1}.", "Las incursiones son opcionales: cada sabotaje deja a Yuyu más débil para el asalto final.": "Raids are optional: each sabotage leaves Yuyu weaker for the final assault.", "Los vecinos del mitin vienen al andén y tiran tomates a los esbirros cercanos cada turno.": "The rally neighbours come to the platform and throw tomatoes at nearby henchmen every turn.", "Yo entro por el lateral: sonrisa, una frase y número apuntado. Flanco y crítico, siempre.": "I come in from the side: smile, one line, number saved. Flank and crit, every time.", "Los esbirros de Yuyu han tomado el parque. Entre árboles, bancos y el lago, toca echarlos.": "Yuyu's henchmen have taken the park. Among the trees, benches and lake, it's time to kick them out.", "<p class=\"muted\">Acércate a 6 casillas de Juanma (sin entrar en su zona) para llamarle.</p>": "<p class=\"muted\">Get within 6 tiles of Juanma (without entering his zone) to call him.</p>", "Detrás del seto, como cuando me escondo de la del martes porque ha aparecido la del jueves.": "Behind the hedge, like when I hide from Tuesday's date because Thursday's showed up.", "Félix López da un mitin en la Plaza de la Asociación. Los esbirros de Yuyu rodean la plaza.": "Félix López holds a rally in Asociación Square. Yuyu's henchmen surround the square.", "Yuyu ha cerrado las urgencias para sus esbirros. Hay que recuperar la entrada del hospital.": "Yuyu has closed A&E for his henchmen. We need to take back the hospital entrance.", "Fuentes del barrio hablan de un grupo de vecinos dispuestos a todo. Yuyu se ríe… de momento.": "Local sources speak of a group of neighbours ready for anything. Yuyu laughs… for now.", "Juanma se lleva a {0} esbirro{1} y les suelta la chapa: se quedan distraídos toda la misión.": "Juanma takes {0} henchm(e)n aside and gives them the lecture: they're distracted for the whole mission.", "Toca hacia dónde apuntar: onda de 6 casillas, 2-3 de daño a todos sin importar la cobertura.": "Tap where to aim: a 6-tile wave, 2–3 damage to everyone regardless of cover.", "{0}\n    <div class=\"btns\"><button class=\"{1}\" id=\"cqb2\">🏠 Abrir el cuartel{2}</button></div>": "{0}\n    <div class=\"btns\"><button class=\"{1}\" id=\"cqb2\">🏠 Open the HQ{2}</button></div>", "Toca una casilla: aparecen las chicas y los esbirros a 3 casillas van hacia ellas sin atacar.": "Tap a tile: the girls appear and henchmen within 3 tiles go after them instead of attacking.", "Desde las torres los esbirros vigilan todo el barrio. Entre los bloques hay que ir con cuidado.": "From the towers the henchmen watch the whole neighbourhood. Tread carefully between the blocks.", "La guardia de Yuyu busca a un tal Maetin. El Faliyo dice que no conoce a ningún «colega rubio».": "Yuyu's guard is looking for one Maetin. Faliyo says he doesn't know any «blond buddy».", "Un uso: toca una casilla y la furgoneta del súper cruza esa fila o columna entera, 4-5 de daño.": "One use: tap a tile and the supermarket van drives across that whole row or column, 4–5 damage.", "Como en una cita: te acercas con estilo y la rematas. Aunque yo nunca necesito la segunda acción.": "Like on a date: you move in with style and close the deal. Though I never need the second action.", "Yuyu ha puesto a sus esbirros a entrenar en las barritas. Toca demostrar quién está más en forma.": "Yuyu has his henchmen training on the bars. Time to prove who's in better shape.", "¡Esbirros de Yuyu! Mira cómo miran el móvil… seguro que alguno es el ex de alguna de mis matches.": "Yuyu's henchmen! Look at them staring at their phones… I bet one's the ex of one of my matches.", "Rapidito, Safu, que tengo tres citas esta tarde y una me acaba de escribir «¿dónde estás, guapo?».": "Quick, Safu, I've got three dates this afternoon and one just texted me «where are you, handsome?».", "Con el buzón petado, Yuyu se comunica peor: sus esbirros no se avisan entre ellos y llegan 2 menos.": "With the mailbox stuffed, Yuyu communicates worse: his henchmen don't warn each other and 2 fewer arrive.", "Ahora yo. Toca mi ficha abajo, o a mí en el mapa, y llévame detrás de la caseta, a la casilla marcada.": "My turn. Tap my card below, or me on the map, and take me behind the hut, to the marked tile.", "Desde su cuartel en {0}, la resistencia avanza turno a turno. Yuyu, según su entorno, «está nervioso».": "From their HQ in {0}, the resistance advances turn by turn. Yuyu, his entourage says, «is nervous».", "El Faliyo os pasa sus hierbas: durante 3 turnos los esbirros no os ven salvo que estéis pegados a ellos.": "Faliyo passes you his herbs: for 3 turns the henchmen can't see you unless you're right next to them.", "Toca una casilla: nube 3x3 durante 2 turnos. Los esbirros fallan muchísimo al disparar a través de ella.": "Tap a tile: a 3x3 cloud for 2 turns. Henchmen miss wildly when shooting through it.", "Yuyu se ha quedado con todo el material del Decathlon. Entre los coches del aparcamiento, a recuperarlo.": "Yuyu has kept all of Decathlon's gear. Among the cars in the car park, let's get it back.", "<button class=\"red big\" id=\"hcont\">▶ Continuar<small>Turno {0} · {1} zona{2} liberada{3}</small></button>": "<button class=\"red big\" id=\"hcont\">▶ Continue<small>Turn {0} · {1} zone{2} liberated</small></button>", "La casa del dictador. No se conquista: se sabotea para debilitarle antes del asalto final en la estación.": "The dictator's house. It can't be conquered: you sabotage it to weaken him before the final assault at the station.", "El escuadrón llega por el aparcamiento de abajo. Los esbirros vigilan los patios y la entrada de urgencias.": "The squad arrives through the lower car park. The henchmen guard the courtyards and the A&E entrance.", "<button class=\"red big\" id=\"hcont\">▶ Continuar la misión<small>{0} · turno {1} de la misión</small></button>": "<button class=\"red big\" id=\"hcont\">▶ Continue the mission<small>{0} · mission turn {1}</small></button>", "El escuadrón llega por la calle Lesaca. Desde los bloques, los esbirros vigilan la Plaza Puerto de Urquiola.": "The squad arrives along Lesaca street. From the blocks, the henchmen watch over Puerto de Urquiola Square.", "La chapa de por qué no tener novia: los esbirros a 3 casillas solo pueden moverse o atacar durante 2 turnos.": "The why-you-shouldn't-have-a-girlfriend lecture: henchmen within 3 tiles can only move or attack for 2 turns.", "Un uso: Safu convence a un esbirro normal a 4 casillas o menos para que se cambie de bando. Lo controlas tú.": "One use: Safu talks a regular henchman within 4 tiles into switching sides. You control it.", "Los esbirros se están comiendo toda la carne de la parrilla. Entre mesas y sillas de la terraza, a por ellos.": "The henchmen are eating all the meat on the grill. Among the terrace tables and chairs, get them.", "Yuyu contraataca tus zonas: refuérzalas con vecinos. Y a veces saca decretos absurdos: obedeces o te rebelas.": "Yuyu counter-attacks your zones: reinforce them with neighbours. And sometimes he issues absurd decrees: obey or rebel.", "<span class=\"res warn\"><span class=\"ri\">🚫</span><div><small>Toque de queda</small><b>{0} turno</b></div></span>": "<span class=\"res warn\"><span class=\"ri\">🚫</span><div><small>Curfew</small><b>{0} turn</b></div></span>", "El escuadrón llega por la calle de Gainza. Los esbirros se están poniendo morados en la terraza de la Parrilla.": "The squad arrives along Gainza street. The henchmen are stuffing themselves on the Parrilla's terrace.", "Toca a Adri y luego a un esbirro: el número amarillo es la probabilidad de acertar. Después pulsa «Tirar lata».": "Tap Adri and then a henchman: the yellow number is the chance to hit. Then press «Throw can».", "<p><b>{0} se une al grupo:</b> a partir de ahora viene siempre con el escuadrón, además de los 4 que elijas.</p>": "<p><b>{0} joins the group:</b> from now on they always come with the squad, on top of the 4 you pick.</p>", "El escuadrón cruza la Avenida de los Poblados. En el parque, los esbirros vigilan la fuente, las pistas y el jardín.": "The squad crosses Avenida de los Poblados. In the park, the henchmen guard the fountain, the courts and the garden.", "Safu monta un numerito en el banco: {0} esbirro{1} no pueden dejar de mirar durante 2 turnos. ¡Aprovechad para pasar!": "Safu puts on a show on the bench: henchmen who can't stop staring for 2 turns: {0}. Slip past now!", "⚠️ <b>Yuyu prepara un ataque contra {0}</b>: llega en {1} turnos con fuerza {2}. Ahora tiene defensa {3}: refuérzala.": "⚠️ <b>Yuyu is preparing an attack on {0}</b>: it arrives in {1} turns with strength {2}. Its defence is now {3}: reinforce it.", "Irene vuelve de Cullera y le echa la bronca en plena batalla: Yuyu empieza con menos vida y a veces se queda sin turno.": "Irene comes back from Cullera and tells him off mid-battle: Yuyu starts with less health and sometimes loses his turn.", "Las barritas de encima son la vida: si llega a cero, ese personaje se va al hospital unos turnos. Ahora, acaba con ellos.": "The bars above their heads are health: if it hits zero, that character goes to hospital for a few turns. Now, finish them off.", "Ahora, el mapa de Orcasitas. Las zonas rojas son de Yuyu: puedes atacar las que tocan con las tuyas, las del borde dorado.": "Now, the map of Orcasitas. Red zones are Yuyu's: you can attack those bordering yours, the ones with a gold edge.", "Solo en su casa, un uso: Jose tira de la lona del pozo (a 5 casillas o menos) y los esbirros que estén encima caen dentro.": "Only at his house, one use: Jose pulls the tarp off the pit (within 5 tiles) and any henchmen on top fall in.", "Wilson y Harold acribillan a latas de cerveza a dos esbirros, que se los llevan detenidos. ¡Dos esbirros menos en la zona!": "Wilson and Harold pelt two henchmen with beer cans, and they get carted off under arrest. Two fewer henchmen in the zone!", "El escuadrón llega por el descampado. Los esbirros vigilan la tienda, el aparcamiento y las manzanas de la calle del Simca.": "The squad arrives across the waste ground. The henchmen guard the shop, the car park and the blocks on Simca street.", "Safu se lleva a {0} esbirro{1} a darles una clase del manual de la putología. No vuelven en toda la misión, y Safu tampoco.": "Safu takes {0} henchm(e)n off for a class from the Womanizer's Handbook. They don't come back all mission — and neither does Safu.", "¡Bienvenido a la academia de Safu! Hoy aprendes a zurrar a los esbirros de Yuyu… y de paso, a ligar como los profesionales.": "Welcome to Safu's academy! Today you'll learn to give Yuyu's henchmen a beating… and, while you're at it, to flirt like the pros.", "La bici que te ha dejado Maetin: te lanzas contra un esbirro a 7 casillas o menos y lo atropellas (4-5 de daño). Un solo uso.": "The bike Maetin lent you: charge at a henchman within 7 tiles and run them over (4–5 damage). Single use.", "<div class=\"zhead {0}\"><div class=\"eyebrow\">{1}</div><h2>{2}</h2>{3}<button class=\"zup\" onclick=\"toMap()\">▲ Mapa</button></div>": "<div class=\"zhead {0}\"><div class=\"eyebrow\">{1}</div><h2>{2}</h2>{3}<button class=\"zup\" onclick=\"toMap()\">▲ Map</button></div>", "<div class=\"tile r\"><small>Ataque de Yuyu</small><b>⚔️ {0}</b></div><div class=\"tile r\"><small>Llega en</small><b>{1} t.</b></div>": "<div class=\"tile r\"><small>Yuyu's attack</small><b>⚔️ {0}</b></div><div class=\"tile r\"><small>Arrives in</small><b>{1} t.</b></div>", "<div class=\"tfoot\"><span class=\"tstep\">{0}</span><span class=\"tbtns\"><button class=\"alt\" id=\"tskip\">Saltar</button>{1}</span></div>": "<div class=\"tfoot\"><span class=\"tstep\">{0}</span><span class=\"tbtns\"><button class=\"alt\" id=\"tskip\">Skip</button>{1}</span></div>", "<p>Elige desde qué zona empezáis a reconquistar Orcasitas. Cada una da una ventaja distinta. La Casa de Yuyu no se puede elegir.</p>": "<p>Choose the zone where you start reconquering Orcasitas. Each one gives a different perk. Yuyu's House can't be chosen.</p>", "Ha llegado el momento: Yuyu en persona espera en su despacho, al fondo de la casa, rodeado de su guardia. Si cae, Orcasitas es libre. ": "The time has come: Yuyu himself waits in his office at the back of the house, surrounded by his guard. If he falls, Orcasitas is free. ", "{0}<div class=\"zbody\">\n      {1}{2}{3}\n      <div class=\"btns\"><button class=\"red\" id=\"cstart\" {4}>⚑ Empezar aquí</button></div></div>": "{0}<div class=\"zbody\">\n      {1}{2}{3}\n      <div class=\"btns\"><button class=\"red\" id=\"cstart\" {4}>⚑ Start here</button></div></div>", "Cuando no te queden acciones, pulsa «Fin del turno». «Vigilancia» deja a alguien atento: si un esbirro se mueve a la vista, le dispara.": "When you're out of actions, press «End turn». «Overwatch» keeps someone alert: if a henchman moves in sight, they shoot.", "Cada turno ganas vecinos, euros y material. En el Cuartel compras mejoras: botiquín, puntería, zapatillas… Yo ya vengo mejorado de serie.": "Every turn you earn neighbours, euros and material. At the HQ you buy upgrades: first-aid kit, aim, trainers… I came upgraded as standard.", "Prueba mis Chicas de Tinder: vienen todas por mí y los esbirros se van detrás de ellas. O mi Escándalo público, que cuando la lío, la lío.": "Try my Tinder Girls: they all come for me and the henchmen chase after them. Or my Public Meltdown — when I kick off, I really kick off.", "Si pillas a uno por un lado donde no le tapa nada, sale «FLANCO»: aciertas más y puedes hacer crítico. Como en el bar: nunca se entra de frente.": "If you catch one from a side where nothing covers him, you get «FLANK»: you hit more often and can land a crit. Like at the bar: never go in head-on.", "Un uso: Safu alecciona a los 3 esbirros normales más cercanos (5 casillas). Se quedan escuchándole toda la misión: los 4 desaparecen del combate.": "One use: Safu lectures the 3 nearest regular henchmen (5 tiles). They stay listening all mission: all 4 leave the fight.", "Esto va por turnos. Cada uno tiene 2 acciones: los puntitos azules de su ficha. Moverse gasta 1; atacar o usar un poder gasta todo lo que te quede.": "It's turn-based. Everyone has 2 actions: the little blue dots on their card. Moving costs 1; attacking or using a power uses up whatever you have left.", "<h2>{0}</h2><p>{1}</p>\n      {2}\n      <div class=\"btns\"><button id=\"go\" {3}>Confirmar</button><button class=\"alt\" id=\"cancel\">Cancelar</button></div>": "<h2>{0}</h2><p>{1}</p>\n      {2}\n      <div class=\"btns\"><button id=\"go\" {3}>Confirm</button><button class=\"alt\" id=\"cancel\">Cancel</button></div>", "Toca hacia dónde apuntar: Maetin saca con la raqueta de tenis y la bola va botando 7 casillas. 3-4 de daño a todos los que pilla y los derriba un turno.": "Tap where to aim: Maetin serves with his tennis racket and the ball bounces 7 tiles. 3–4 damage to everyone it hits and knocks them down for a turn.", "<rect x=\"528\" y=\"6\" width=\"262\" height=\"56\" rx=\"8\"/><text x=\"659\" y=\"30\" class=\"rt1\">🚆 ESTACIÓN DE ORCASITAS</text><text x=\"659\" y=\"51\" class=\"rt2\">{0}</text>": "<rect x=\"528\" y=\"6\" width=\"262\" height=\"56\" rx=\"8\"/><text x=\"659\" y=\"30\" class=\"rt1\">🚆 ORCASITAS STATION</text><text x=\"659\" y=\"51\" class=\"rt2\">{0}</text>", "Eso es cobertura. Los escuditos del suelo te lo chivan: medio escudo es cobertura baja y escudo entero, cobertura alta. Detrás de algo te aciertan mucho menos.": "That's cover. The little shields on the ground give it away: half a shield is low cover and a full shield is high cover. Behind something, they hit you far less.", "Solo en la Parrilla, dos veces: Adri silba y Jambus atropella con su patinete al esbirro que elijas (4-5 de daño). La primera vez se esconde; la segunda se larga.": "Only at the Parrilla, twice: Adri whistles and Jambus runs over the henchman you pick with his scooter (4–5 damage). The first time he hides; the second he's off.", "Con 5 zonas se desbloquea el asalto final en la estación de Renfe, y cada zona liberada da una ventaja para esa batalla. Como mis citas: a la quinta, la definitiva.": "With 5 zones the final assault at Renfe station unlocks, and each liberated zone gives a perk for that battle. Like my dates: fifth time's the charm.", "Mira y aprende. Mi poder es Compadreo: me camelo a un esbirro y se pasa a nuestro bando. Elígeme, pulsa el botón azul «Compadreo» y toca al esbirro que tengo cerca.": "Watch and learn. My power is Buddy Talk: I sweet-talk a henchman and he switches to our side. Pick me, press the blue «Buddy Talk» button and tap the henchman near me.", "Adri ya está elegido: lleva el aro amarillo. Toca la casilla que brilla, detrás del seto. Las azules son andando; las amarillas, corriendo (gastas las dos acciones).": "Adri is already selected: he has the yellow ring. Tap the glowing tile behind the hedge. Blue tiles are walking; yellow ones are running (you spend both actions).", "Solo en esta misión, un uso: Dani le monta un partido a Maetin. Los esbirros que ven la pista se quedan mirando 2 turnos: no se mueven, apuntan fatal y pierden la cobertura.": "This mission only, one use: Dani sets up a match for Maetin. Henchmen who can see the court stare for 2 turns: they don't move, aim terribly and lose their cover.", "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>{1} sigue en manos de Yuyu</h3>\n      <p>La moral baja 1 y Yuyu refuerza la zona.</p><p class=\"muted\">Al hospital {2} turno{3}: {4}.</p>": "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>{1} stays in Yuyu's hands</h3>\n      <p>Morale drops 1 and Yuyu reinforces the zone.</p><p class=\"muted\">To hospital for {2} turn{3}: {4}.</p>", "Adri se vuelve loco y la lía: grita, vacila y se encara. Al esbirro más cercano le cae 2-3 de daño y lo aparta de un empujón; los demás a 3 casillas se quedan flipando y apuntan mucho peor un turno.": "Adri loses it and kicks off: he shouts, mouths off and squares up. The nearest henchman takes 2–3 damage and gets shoved back; the rest within 3 tiles are stunned and aim much worse for a turn.", "<div class=\"eyebrow\">MISIÓN CUMPLIDA</div><h3>¡{0} liberada!</h3>\n      <p>Recompensa: +{1} vecinos, +{2} euros, +{3} de material y +1 de moral.</p><p class=\"muted\">Ventaja nueva: {4}</p>\n      {5}{6}": "<div class=\"eyebrow\">MISSION ACCOMPLISHED</div><h3>{0} liberated!</h3>\n      <p>Reward: +{1} neighbours, +{2} euros, +{3} material and +1 morale.</p><p class=\"muted\">New perk: {4}</p>\n      {5}{6}", "<div class=\"rephd\"><span class=\"tbig\">{0}</span><div><div class=\"eyebrow\">NUEVO TURNO</div><h3>Así está el barrio</h3></div></div><ul class=\"rep\">{1}</ul>\n    <div class=\"btns\"><button id=\"okT\">{2}</button></div>": "<div class=\"rephd\"><span class=\"tbig\">{0}</span><div><div class=\"eyebrow\">NEW TURN</div><h3>How the neighbourhood's doing</h3></div></div><ul class=\"rep\">{1}</ul>\n    <div class=\"btns\"><button id=\"okT\">{2}</button></div>", "<div class=\"tiles\"><div class=\"tile g\"><small>Defensa</small><b>🛡️ {0}</b></div>{1}</div>\n      {2}\n      {3}{4}{5}\n      {6}\n      <div class=\"btns\"><button id=\"creinf\" {7}>🧱 Reforzar +2 · {8} vecinos</button></div>": "<div class=\"tiles\"><div class=\"tile g\"><small>Defence</small><b>🛡️ {0}</b></div>{1}</div>\n      {2}\n      {3}{4}{5}\n      {6}\n      <div class=\"btns\"><button id=\"creinf\" {7}>🧱 Reinforce +2 · {8} neighbours</button></div>", "<button class=\"alt mini qx\" id=\"gx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">LA RESISTENCIA</div><h3>Conoce al escuadrón</h3>\n    <div class=\"gal\">{0}</div>\n    <div class=\"btns\"><button id=\"gok\">Cerrar</button></div>": "<button class=\"alt mini qx\" id=\"gx\" aria-label=\"Close\">✕</button><div class=\"eyebrow\">THE RESISTANCE</div><h3>Meet the squad</h3>\n    <div class=\"gal\">{0}</div>\n    <div class=\"btns\"><button id=\"gok\">Close</button></div>", "{0}<div class=\"zbody\"><p>Las zonas rojas con borde dorado se pueden atacar. En las tuyas puedes reforzar la defensa. Cada turno puedes hacer una misión; al volver, el turno avanza. Si no quieres atacar, pulsa «Terminar turno».</p></div>": "{0}<div class=\"zbody\"><p>Red zones with a gold edge can be attacked. In yours you can reinforce the defence. Each turn you can do one mission; when you return, the turn advances. If you don't want to attack, press «End turn».</p></div>", "<button class=\"alt mini qx\" id=\"qx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">CUARTEL DE LA RESISTENCIA</div><h3>Mejoras</h3>{0}\n    <div class=\"qgrid\">{1}</div>\n    <div class=\"btns\"><button class=\"alt\" id=\"qclose\">Cerrar</button></div>": "<button class=\"alt mini qx\" id=\"qx\" aria-label=\"Close\">✕</button><div class=\"eyebrow\">RESISTANCE HQ</div><h3>Upgrades</h3>{0}\n    <div class=\"qgrid\">{1}</div>\n    <div class=\"btns\"><button class=\"alt\" id=\"qclose\">Close</button></div>", "<div class=\"tutend\"><div class=\"eyebrow\" style=\"color:#f07a8c\">CALABAZAS</div><h3>Hasta los esbirros te han dado calabazas</h3>\n    {0}{1}<div class=\"btns\"><button id=\"trep\">Repetir el tutorial</button><button class=\"alt\" id=\"tout\">Salir</button></div></div>": "<div class=\"tutend\"><div class=\"eyebrow\" style=\"color:#f07a8c\">REJECTED</div><h3>Even the henchmen turned you down</h3>\n    {0}{1}<div class=\"btns\"><button id=\"trep\">Repeat the tutorial</button><button class=\"alt\" id=\"tout\">Exit</button></div></div>", "<div class=\"eyebrow\" style=\"color:#f07a8c\">DERROTA</div><h3>Yuyu ha aplastado la resistencia</h3><p>No os queda ni una zona en Orcasitas. El barrio sigue bajo la dictadura, pero no olvida.</p>\n      <div class=\"btns\"><button id=\"nc\">Nueva campaña</button></div>": "<div class=\"eyebrow\" style=\"color:#f07a8c\">DEFEAT</div><h3>Yuyu has crushed the resistance</h3><p>You don't have a single zone left in Orcasitas. The neighbourhood remains under the dictatorship, but it doesn't forget.</p>\n      <div class=\"btns\"><button id=\"nc\">New campaign</button></div>", "<div class=\"tiles\"><div class=\"tile r\"><small>Esbirros</small><b>😈 {0}</b></div><div class=\"tile {1}\"><small>Dificultad</small><b>{2}</b></div></div>\n        {3}{4}{5}\n        {6}\n        <div class=\"btns\"><button class=\"red\" id=\"catt\" {7}>⚔️ {8}</button></div>": "<div class=\"tiles\"><div class=\"tile r\"><small>Henchmen</small><b>😈 {0}</b></div><div class=\"tile {1}\"><small>Difficulty</small><b>{2}</b></div></div>\n        {3}{4}{5}\n        {6}\n        <div class=\"btns\"><button class=\"red\" id=\"catt\" {7}>⚔️ {8}</button></div>", "<div class=\"tutend\" style=\"display:grid;gap:10px\"><div class=\"eyebrow\">TUTORIAL SUPERADO</div><h3>¡Primera cita superada!</h3>\n    {0}\n    {1}\n    {2}\n    {3}\n    {4}\n    <div class=\"btns\"><button class=\"red\" id=\"tgo\">¡A reconquistar Orcasitas!</button></div></div>": "<div class=\"tutend\" style=\"display:grid;gap:10px\"><div class=\"eyebrow\">TUTORIAL COMPLETE</div><h3>First date: nailed it!</h3>\n    {0}\n    {1}\n    {2}\n    {3}\n    {4}\n    <div class=\"btns\"><button class=\"red\" id=\"tgo\">Let's retake Orcasitas!</button></div></div>", "Yuyu se ha atrincherado en la estación de Renfe de Orcasitas para escapar en el Cercanías. Está en el andén del fondo, al otro lado de las vías, con tres sargentos y sus esbirros. Cruzad el vestíbulo, pasad los tornos y las vías, y acabad con él. Si cae, Orcasitas es libre. ": "Yuyu has dug in at Orcasitas Renfe station to escape on the commuter train. He's on the far platform, across the tracks, with three sergeants and his henchmen. Cross the hall, get past the turnstiles and the tracks, and finish him. If he falls, Orcasitas is free. ", "<h3>¿Retirarse?</h3><p>El escuadrón vuelve al cuartel. Los que hayan caído se quedan en el hospital, la zona sigue en manos de Yuyu y la moral baja 1.</p>\n    <div class=\"btns\"><button class=\"red\" id=\"ry\">Retirarse</button><button class=\"alt\" id=\"rn\">Seguir luchando</button></div>": "<h3>Retreat?</h3><p>The squad returns to HQ. Anyone who went down stays in hospital, the zone stays in Yuyu's hands and morale drops 1.</p>\n    <div class=\"btns\"><button class=\"red\" id=\"ry\">Retreat</button><button class=\"alt\" id=\"rn\">Keep fighting</button></div>", "<h2>{0}</h2><p>Contra {1} ({2}/{3} de vida)</p>\n      <p><b style=\"font-family:var(--display);font-size:28px;color:var(--gold)\">{4}%</b> de acierto · {5}-{6} de daño{7}</p>\n      <div class=\"btns\"><button id=\"fire\">{8}</button><button class=\"alt\" id=\"cancel\">Cancelar</button></div>": "<h2>{0}</h2><p>Against {1} ({2}/{3} HP)</p>\n      <p><b style=\"font-family:var(--display);font-size:28px;color:var(--gold)\">{4}%</b> to hit · {5}-{6} damage{7}</p>\n      <div class=\"btns\"><button id=\"fire\">{8}</button><button class=\"alt\" id=\"cancel\">Cancel</button></div>", "<div class=\"dhd\"><canvas id=\"dpor\"></canvas><div><b>{0}</b><span>{1}</span>{2}</div></div>\n      <div class=\"dstats\"><span>Vida <b>{3}</b></span><span>Puntería <b>{4}</b></span><span>Mov. <b>{5}</b></span></div>\n      <p class=\"muted\"><b>Ataque:</b> {6}, {7}-{8} de daño{9}.</p>\n      {10}": "<div class=\"dhd\"><canvas id=\"dpor\"></canvas><div><b>{0}</b><span>{1}</span>{2}</div></div>\n      <div class=\"dstats\"><span>Health <b>{3}</b></span><span>Aim <b>{4}</b></span><span>Move <b>{5}</b></span></div>\n      <p class=\"muted\"><b>Attack:</b> {6}, {7}-{8} damage{9}.</p>\n      {10}", "Yuyu ha requisado la pista de pickleball del final de la calle Gainza. Maetin y dos colegas suyos del Decathlon siguen jugando dentro como si nada, pero los esbirros de Yuyu, con su sargento, vigilan la pista. Si llevas a Dani, puede liarles con una partida de pickleball para que bajen la guardia.": "Yuyu has commandeered the pickleball court at the end of Gainza street. Maetin and two mates from Decathlon keep playing inside as if nothing's happening, but Yuyu's henchmen and their sergeant guard the court. If you bring Dani, he can distract them with a pickleball match so they drop their guard.", "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>Yuyu sigue atrincherado en la estación</h3><p>La moral baja 1. Recuperaos, liberad más zonas o saboteadle la casa y volved a intentarlo.</p>\n      <p class=\"muted\">Al hospital {1} turno{2}: {3}.</p><div class=\"btns\"><button id=\"bk\">Volver al mapa</button></div>": "<div class=\"eyebrow\" style=\"color:#f07a8c\">{0}</div><h3>Yuyu is still dug in at the station</h3><p>Morale drops 1. Recover, liberate more zones or sabotage his house and try again.</p>\n      <p class=\"muted\">To hospital for {1} turn{2}: {3}.</p><div class=\"btns\"><button id=\"bk\">Back to the map</button></div>", "Los esbirros de Yuyu han tomado el Parque de Pradolongo: la fuente circular, las pistas azules y el jardín de setos. En un banco de la zona de tierra está Safu dándose el lote con su ligue, a lo suyo. Si llegas a su lado, montará un numerito tan exagerado que los esbirros no podrán dejar de mirar, y os dejarán pasar.": "Yuyu's henchmen have taken Pradolongo Park: the round fountain, the blue courts and the hedge garden. On a bench in the dirt area, Safu is snogging his date, in his own world. If you reach him, he'll put on such an over-the-top show that the henchmen won't be able to look away, and they'll let you through.", "Los esbirros de Yuyu vigilan la Plaza Puerto de Urquiola desde los cuatro bloques blancos que la rodean. En medio de la plaza está el Faliyo con su bici tuneada, gritando que están \"bricolando\" y llamando al colega rubio. Si llegas a su lado, os pasará unas hierbas suyas que os vuelven casi invisibles para los esbirros durante unos turnos.": "Yuyu's henchmen guard Puerto de Urquiola Square from the four white blocks around it. In the middle of the square is Faliyo with his souped-up bike, shouting that they're \"DIY-ing\" and calling for his blond buddy. If you reach him, he'll pass you some of his herbs that make you almost invisible to the henchmen for a few turns.", "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu ha caído en el turno {0}. Se acabaron los decretos: vuelven las cañas, el chándal y el pickleball para todos.</p>\n        <p class=\"muted\">{1} misiones ganadas.</p><div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>": "<div class=\"eyebrow\">VICTORY</div><h3>Orcasitas is free!</h3><p>Yuyu fell on turn {0}. No more decrees: beers, tracksuits and pickleball are back for everyone.</p>\n        <p class=\"muted\">{1} missions won.</p><div class=\"btns\"><button id=\"nc\">New campaign</button><button class=\"alt\" id=\"bk\">See the map</button></div>", "\n    <span class=\"turnchip\"><small>TURNO</small><b>{0}</b></span>\n    {1}{2}{3}\n    <span class=\"res mor\" style=\"--ac:#ff9ad5\"><span class=\"ri\">✊</span><div><small>Moral</small><b>{4}{5}</b></div></span>\n    {6}\n    <span class=\"ctopbtns\"><button class=\"alt\" id=\"cqb\">🏠 Cuartel{7}</button><button class=\"red\" id=\"cend\">Terminar turno ▶</button></span>": "\n    <span class=\"turnchip\"><small>TURN</small><b>{0}</b></span>\n    {1}{2}{3}\n    <span class=\"res mor\" style=\"--ac:#ff9ad5\"><span class=\"ri\">✊</span><div><small>Morale</small><b>{4}{5}</b></div></span>\n    {6}\n    <span class=\"ctopbtns\"><button class=\"alt\" id=\"cqb\">🏠 HQ{7}</button><button class=\"red\" id=\"cend\">End turn ▶</button></span>", "Yuyu ha puesto a sus esbirros a entrenar en las barritas, entre los bloques de pisos junto a la Avenida de los Poblados. En un sillón abandonado en la calle están Wilson y Harold, a su rollo y con sus latas. Si llegas a su lado, les tiran latas de cerveza a los esbirros, y dos de ellos acabarán llevándoselos detenidos: dos esbirros menos para vosotros.": "Yuyu has his henchmen training on the bars, among the blocks of flats by Avenida de los Poblados. On an abandoned armchair in the street sit Wilson and Harold, minding their own business with their cans. If you reach them, they'll throw beer cans at the henchmen, and two of them will end up being carted off under arrest: two fewer henchmen for you.", "Los esbirros de Yuyu se están comiendo toda la carne de La Parrilla Gaucha, entre las calles Ordicia y Gainza. Por la zona anda Jambus con su patinete, cojeando de la pierna derecha pero a toda pastilla. Si llevas a Adri, puede avisarle para que atropelle a un esbirro; después Jambus se esconde, y se le puede avisar una segunda vez antes de que se largue.": "Yuyu's henchmen are eating all the meat at La Parrilla Gaucha, between Ordicia and Gainza streets. Jambus is around on his scooter, limping on his right leg but going flat out. If you bring Adri, he can call him to run over a henchman; then Jambus hides, and you can call him a second time before he's off.", "Yuyu ha cerrado las urgencias del 12 de Octubre para sus esbirros. Delante de la entrada está Juanma con su perrazo, buscando a quién darle la chapa. Ojo: si te acercas a su zona (la marca amarilla), te la suelta a ti y pierdes el turno. Pero desde un poco más lejos puedes llamarle para que se la dé a dos esbirros, que se quedarán distraídos toda la misión.": "Yuyu has closed A&E at 12 de Octubre for his henchmen. In front of the entrance is Juanma with his huge dog, looking for someone to lecture. Careful: if you get near his zone (the yellow mark), he'll lecture you and you lose your turn. But from a bit further away you can call him so he lectures two henchmen, who'll stay distracted all mission.", "<p>Yuyu en persona, con su guardia, en su casa.</p>\n        <div class=\"sabs\">{0}</div>\n        <p class=\"muted\">{1}</p>\n        <p class=\"muted\">Yuyu se ha atrincherado en la estación de Renfe de Orcasitas para huir en el Cercanías. El asalto final es allí.</p>\n        <div class=\"btns\"><button class=\"red\" id=\"craid\" {2}>🕵️ Incursión: sabotear</button></div>": "<p>Yuyu himself, with his guard, at home.</p>\n        <div class=\"sabs\">{0}</div>\n        <p class=\"muted\">{1}</p>\n        <p class=\"muted\">Yuyu has dug in at Orcasitas Renfe station to flee on the commuter train. That's where the final assault is.</p>\n        <div class=\"btns\"><button class=\"red\" id=\"craid\" {2}>🕵️ Raid: sabotage</button></div>", "En la Plaza de la Asociación, junto al Centro Cultural de la Meseta, Félix López está dando un mitin sobre los cubos de basura y las cosas que hace Yuyu. A Yuyu no le gusta nada y manda esbirros para reventarlo, y seguirá mandando más durante la misión. La gente del mitin está con vosotros: los esbirros que se acerquen a la multitud se llevarán una lluvia de tomates.": "In Asociación Square, next to the Meseta Cultural Centre, Félix López is holding a rally about the bins and everything Yuyu is up to. Yuyu doesn't like it one bit and sends henchmen to break it up, and he'll keep sending more during the mission. The rally crowd is on your side: henchmen who get close to the crowd will get a shower of tomatoes.", "<div class=\"eyebrow\">VICTORIA</div><h3>¡Orcasitas es libre!</h3><p>Yuyu ha caído en el andén de la estación de Orcasitas, en el turno {0}, sin llegar a subirse al Cercanías.{1} Se acabaron los decretos: vuelven las cañas, el chándal y el pickleball para todos.</p>\n        {2}<div class=\"btns\"><button id=\"nc\">Nueva campaña</button><button class=\"alt\" id=\"bk\">Ver el mapa</button></div>": "<div class=\"eyebrow\">VICTORY</div><h3>Orcasitas is free!</h3><p>Yuyu fell on the platform at Orcasitas station, on turn {0}, without managing to board the commuter train.{1} No more decrees: beers, tracksuits and pickleball are back for everyone.</p>\n        {2}<div class=\"btns\"><button id=\"nc\">New campaign</button><button class=\"alt\" id=\"bk\">See the map</button></div>", "Yuyu se ha quedado con todo el material del Decathlon de Usera. En la puerta de la tienda está Maetin: el que llegue a su lado se lleva una bici con la que atropellar a un esbirro, y vale para cada uno del escuadrón que llegue. En el aparcamiento anda Danilo, que se pondrá a ligar con los esbirros que se le acerquen cuando le dé por ahí (como mucho con dos), y esos se olvidarán de pelear.": "Yuyu has kept all the gear from Decathlon Usera. At the shop door stands Maetin: whoever reaches him gets a bike to run over a henchman, and it works for each squad member who gets there. Danilo hangs around the car park and will start flirting with henchmen who get near him whenever he feels like it (two at most), and those will forget about fighting.", "Los esbirros han okupado la casa de Jotechno, junto a los Jardines de Orcasitas y el Centro de Mayores. En el cruce de caminos hay una lona azul que tapa el pozo de mierda: si llevas a Jose, puede tirar de ella cuando haya esbirros encima. En el parque infantil está la nevera de Jotechno con las croquetas de su madre: quien llegue gana +2 de vida máxima, pero el sargento la vigila de cerca.": "The henchmen have squatted Jotechno's house, next to the Orcasitas Gardens and the Senior Centre. Where the paths cross there's a blue tarp covering the poo pit: if you bring Jose, he can pull it when henchmen are standing on it. In the playground is Jotechno's fridge with his mum's croquettes: whoever reaches it gets +2 max health, but the sergeant guards it closely.", "Os coláis en la casa del dictador para debilitarlo antes del asalto final. Está más vigilada que nunca. Hay tres sabotajes posibles, marcados en amarillo: el cuadro eléctrico de la cocina (apagón por Cortilandia), el buzón de la entrada (lluvia de cartas de moroso) y el móvil de Yuyu en la mesilla del dormitorio (llamada a Irene). Pon a alguien al lado y pulsa el botón. Lo que sabotees se queda hecho aunque te retires. Si lo haces todo, salís corriendo con la misión cumplida.": "You sneak into the dictator's house to weaken him before the final assault. It's more heavily guarded than ever. There are three possible sabotages, marked in yellow: the kitchen fuse box (Christmas-lights blackout), the mailbox by the door (rain of debt letters) and Yuyu's phone on the bedside table (call to Irene). Put someone next to it and press the button. Whatever you sabotage stays done even if you retreat. Do them all and you run out with the mission accomplished.", "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">DECRETO DEL EXCELENTÍSIMO YUYU · TURNO {0}</div>\n    <h3 style=\"color:#6e1424\">{1}</h3>\n    <p class=\"opt\"><b>Si obedeces:</b> {2} La moral baja 1.</p>\n    <p class=\"opt\"><b>Si te rebelas:</b> la moral sube 1, pero Yuyu manda 1 esbirro más a cada zona que hace frontera contigo y adelanta su próximo ataque.</p>\n    <div class=\"btns\"><button class=\"alt\" id=\"dob\">Obedecer</button><button class=\"red\" id=\"dre\">Rebelarse</button></div></div>": "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">DECREE OF HIS EXCELLENCY YUYU · TURN {0}</div>\n    <h3 style=\"color:#6e1424\">{1}</h3>\n    <p class=\"opt\"><b>If you obey:</b> {2} Morale drops 1.</p>\n    <p class=\"opt\"><b>If you rebel:</b> morale rises 1, but Yuyu sends 1 more henchman to every zone bordering yours and brings his next attack forward.</p>\n    <div class=\"btns\"><button class=\"alt\" id=\"dob\">Obey</button><button class=\"red\" id=\"dre\">Rebel</button></div></div>", "<div class=\"epi\"><div class=\"eyebrow\">EPÍLOGO</div>{0}\n    <div class=\"epl yu\"><canvas data-e=\"yuyu\"></canvas><p><b>Yuyu.</b> Irene se lo lleva de vuelta a Cullera. Dicen que ahora dicta decretos en la playa y nadie le hace caso.</p></div></div>\n    <div class=\"estats\"><div><b>{1}</b><span>turnos</span></div><div><b>{2}</b><span>misiones ganadas</span></div><div><b>{3}</b><span>zonas liberadas</span></div><div><b>{4}</b><span>sabotajes</span></div><div><b>{5}</b><span>MVP del escuadrón</span></div></div>": "<div class=\"epi\"><div class=\"eyebrow\">EPILOGUE</div>{0}\n    <div class=\"epl yu\"><canvas data-e=\"yuyu\"></canvas><p><b>Yuyu.</b> Irene takes him back to Cullera. They say he now issues decrees on the beach and nobody listens.</p></div></div>\n    <div class=\"estats\"><div><b>{1}</b><span>turns</span></div><div><b>{2}</b><span>missions won</span></div><div><b>{3}</b><span>zones liberated</span></div><div><b>{4}</b><span>sabotages</span></div><div><b>{5}</b><span>squad MVP</span></div></div>", "{0}<div class=\"zbody\">\n      <p>Yuyu se ha atrincherado en la estación de Renfe con su guardia para huir en el Cercanías. Si cae, Orcasitas es libre.</p>\n      <div class=\"tiles\"><div class=\"tile {1}\"><small>Zonas</small><b>{2}/{3}</b></div><div class=\"tile y\"><small>Ventajas</small><b>{4}</b></div></div>\n      <div class=\"prog\"><i style=\"width:{5}%\"></i></div>\n      <p>{6}</p>\n      <div class=\"sabs\">{7}\n      {8}</div>\n      <div class=\"btns\"><button class=\"red\" id=\"cfin\" {9}>🚆 Asalto final</button></div></div>": "{0}<div class=\"zbody\">\n      <p>Yuyu has dug in at Renfe station with his guard to flee on the commuter train. If he falls, Orcasitas is free.</p>\n      <div class=\"tiles\"><div class=\"tile {1}\"><small>Zones</small><b>{2}/{3}</b></div><div class=\"tile y\"><small>Perks</small><b>{4}</b></div></div>\n      <div class=\"prog\"><i style=\"width:{5}%\"></i></div>\n      <p>{6}</p>\n      <div class=\"sabs\">{7}\n      {8}</div>\n      <div class=\"btns\"><button class=\"red\" id=\"cfin\" {9}>🚆 Final assault</button></div></div>", "<div class=\"sq\">\n    <div class=\"sqhead\"><div><div class=\"eyebrow\">MISIÓN · TURNO {0}</div><h3>{1}</h3><p class=\"muted sqintro\">{2}</p>{3}</div></div>\n    <div class=\"sqteam\"><div class=\"sqlbl\">TU ESCUADRÓN <span id=\"cnt\"></span></div><div class=\"slots\" id=\"slots\"></div></div>\n    <div class=\"sqbody\"><div class=\"sqgrid\" id=\"picks\"></div><aside class=\"sqdet\" id=\"sqdet\"></aside></div>\n    <div class=\"sqfoot\"><button class=\"alt\" id=\"cancm\">Volver al mapa</button><button class=\"red big\" id=\"startm\">¡Adelante!</button></div></div>": "<div class=\"sq\">\n    <div class=\"sqhead\"><div><div class=\"eyebrow\">MISSION · TURN {0}</div><h3>{1}</h3><p class=\"muted sqintro\">{2}</p>{3}</div></div>\n    <div class=\"sqteam\"><div class=\"sqlbl\">YOUR SQUAD <span id=\"cnt\"></span></div><div class=\"slots\" id=\"slots\"></div></div>\n    <div class=\"sqbody\"><div class=\"sqgrid\" id=\"picks\"></div><aside class=\"sqdet\" id=\"sqdet\"></aside></div>\n    <div class=\"sqfoot\"><button class=\"alt\" id=\"cancm\">Back to the map</button><button class=\"red big\" id=\"startm\">Let's go!</button></div></div>", "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">ÚLTIMA HORA DESDE ORCASITAS</div>\n    <h3 style=\"color:#6e1424\">Yuyu se ha hecho con el barrio</h3>\n    <p>Ha tomado las Torres, el Decathlon, el Pickleball y hasta la Parrilla Gaucha. Desde su casa dicta decretos absurdos y sus esbirros vigilan cada calle.</p>\n    <p>La resistencia se organiza: elige dónde montar el cuartel, libera el barrio zona a zona, mejora al escuadrón y aguanta los contraataques. Cuando controléis 5 zonas, podréis asaltar la estación de Renfe de Orcasitas, donde Yuyu se ha atrincherado. Cada zona liberada os dará una ventaja en esa batalla final, y saboteando su casa le dejaréis más débil.</p>\n    <div class=\"opt tutq\"><b>¿Primera vez?</b> Safu y Adri te enseñan a jugar en una cita rápida de 3 minutos. Es opcional: puedes hacerlo cuando quieras desde el botón «Tutorial» del Diario.</div>\n    <div class=\"btns\"><button class=\"red\" id=\"st\">Empezar la campaña</button><button class=\"alt\" id=\"stt\">🎓 Hacer el tutorial</button></div></div>": "<div class=\"poster-in\"><div class=\"eyebrow\" style=\"color:#b02a3e\">BREAKING NEWS FROM ORCASITAS</div>\n    <h3 style=\"color:#6e1424\">Yuyu has taken over the neighbourhood</h3>\n    <p>He's taken the Towers, Decathlon, the Pickleball court and even La Parrilla Gaucha. From his house he issues absurd decrees and his henchmen watch every street.</p>\n    <p>The resistance gets organised: choose where to set up HQ, liberate the neighbourhood zone by zone, upgrade the squad and hold off the counter-attacks. Once you control 5 zones, you can storm Orcasitas Renfe station, where Yuyu has dug in. Each liberated zone gives you a perk in that final battle, and sabotaging his house will leave him weaker.</p>\n    <div class=\"opt tutq\"><b>First time?</b> Safu and Adri teach you to play on a quick 3-minute date. It's optional: you can do it any time from the «Tutorial» button in the Diary.</div>\n    <div class=\"btns\"><button class=\"red\" id=\"st\">Start the campaign</button><button class=\"alt\" id=\"stt\">🎓 Do the tutorial</button></div></div>", "<button class=\"alt mini qx\" id=\"hx\" aria-label=\"Cerrar\">✕</button><div class=\"eyebrow\">CÓMO SE JUEGA</div><h3>La reconquista en 6 pasos</h3>\n    <ol class=\"how\"><li><b>Elige tu cuartel.</b> Cada zona da una ventaja distinta. Yuyu nunca ataca tu cuartel.</li>\n      <li><b>Ataca zonas vecinas.</b> El número del mapa son los esbirros que hay: cuanto más esperes, más manda Yuyu.</li>\n      <li><b>Combate por turnos.</b> Cada personaje tiene 2 acciones. Ponte a cubierto (escuditos), flanquea y usa los poderes.</li>\n      <li><b>Mejora en el Cuartel.</b> Con euros y material compras botiquines, puntería, zapatillas… Y el escuadrón sube de rango con la experiencia.</li>\n      <li><b>Defiende el barrio.</b> Yuyu contraataca tus zonas: refuérzalas con vecinos. Sus decretos los puedes obedecer o desafiar.</li>\n      <li><b>Asalto final.</b> Con 5 zonas se abre la estación de Renfe. Cada zona liberada y cada sabotaje en la Casa de Yuyu te ayuda.</li></ol>\n    <div class=\"btns\"><button id=\"hok\">Entendido</button><button class=\"alt\" id=\"htut2\">🎓 Mejor, el tutorial</button></div>": "<button class=\"alt mini qx\" id=\"hx\" aria-label=\"Close\">✕</button><div class=\"eyebrow\">HOW TO PLAY</div><h3>The reconquest in 6 steps</h3>\n    <ol class=\"how\"><li><b>Choose your HQ.</b> Each zone gives a different perk. Yuyu never attacks your HQ.</li>\n      <li><b>Attack neighbouring zones.</b> The number on the map is how many henchmen are there: the longer you wait, the more Yuyu sends.</li>\n      <li><b>Turn-based combat.</b> Each character has 2 actions. Get into cover (little shields), flank and use powers.</li>\n      <li><b>Upgrade at the HQ.</b> With euros and material you buy first-aid kits, aim, trainers… And the squad ranks up with experience.</li>\n      <li><b>Defend the neighbourhood.</b> Yuyu counter-attacks your zones: reinforce them with neighbours. You can obey or defy his decrees.</li>\n      <li><b>Final assault.</b> With 5 zones, Renfe station opens up. Every liberated zone and every sabotage at Yuyu's House helps you.</li></ol>\n    <div class=\"btns\"><button id=\"hok\">Got it</button><button class=\"alt\" id=\"htut2\">🎓 I'd rather do the tutorial</button></div>", "<div class=\"hgrid\">\n    <div class=\"hposter\"><div class=\"rays\"></div><div class=\"hframe\"><canvas id=\"yuyuBig\"></canvas></div>\n      <div class=\"hbanner\">EL LÍDER SUPREMO<br>OS VIGILA</div><div class=\"spray\">¡ABAJO<br>YUYU!</div><div class=\"stamp\">RESISTENCIA</div></div>\n    <div class=\"hmain\"><div class=\"eyebrow\">DADDYS GAMES PRESENTA</div><h1 class=\"htitle\">La Reconquista<br>de Orcasitas</h1>\n      <p class=\"htag\">Yuyu se ha hecho con el barrio. Monta la resistencia con tu escuadrón, libera Orcasitas zona a zona y échale de la estación de Renfe.</p>\n      <div class=\"hmenu\">\n        {0}\n        <button class=\"{1}\" id=\"hnew\">{2}</button>\n        <button class=\"alt\" id=\"htut\">🎓 Tutorial con Safu y Gorrón</button>\n        <div class=\"hrow\"><button class=\"alt\" id=\"hsq\">🧢 Conoce al escuadrón</button><button class=\"alt\" id=\"hhow\">📖 Cómo se juega</button><button class=\"alt\" id=\"hmus\">{3}</button></div>\n      </div></div>\n    <section class=\"hpaper\"><div class=\"ptabs\"><button class=\"ptab on\" id=\"tabEco\">📰 El Eco del Barrio</button><button class=\"ptab\" id=\"tabNov\">🆕 Novedades del juego</button></div>\n      <div id=\"hnews\"><div class=\"mast\"><b>EL ECO DEL BARRIO</b><span>{4} · Edición de Orcasitas · {5}</span></div>\n        <div class=\"pcols\"><article class=\"plead\"><h3>{6}</h3><p>{7}</p></article>\n          <aside class=\"bole\"><div class=\"bhd\">BOLETÍN OFICIAL DE YUYU</div><p class=\"bnum\">Decreto nº {8}</p><h4>{9}</h4><p>{10}</p><p class=\"bsign\">— El Excelentísimo Yuyu</p></aside>\n          {11}</div></div>\n      <div id=\"hpatch\" hidden><div class=\"mast\"><b>NOVEDADES</b><span>Lo último en La Reconquista de Orcasitas</span></div><div class=\"patch\">{12}</div></div>\n    </section></div>\n    <div class=\"ticker\"><span class=\"tlabel\">ÚLTIMA HORA</span><div class=\"tmove\"><div class=\"ttrack\">{13}{14}</div></div></div>": "<div class=\"hgrid\">\n    <div class=\"hposter\"><div class=\"rays\"></div><div class=\"hframe\"><canvas id=\"yuyuBig\"></canvas></div>\n      <div class=\"hbanner\">THE SUPREME LEADER<br>IS WATCHING YOU</div><div class=\"spray\">DOWN WITH<br>YUYU!</div><div class=\"stamp\">RESISTANCE</div></div>\n    <div class=\"hmain\"><div class=\"eyebrow\">DADDYS GAMES PRESENTS</div><h1 class=\"htitle\">The Reconquest<br>of Orcasitas</h1>\n      <p class=\"htag\">Yuyu has taken over the neighbourhood. Build the resistance with your squad, liberate Orcasitas zone by zone and kick him out of Renfe station.</p>\n      <div class=\"hmenu\">\n        {0}\n        <button class=\"{1}\" id=\"hnew\">{2}</button>\n        <button class=\"alt\" id=\"htut\">🎓 Tutorial with Safu and the Freeloader</button>\n        <div class=\"hrow\"><button class=\"alt\" id=\"hsq\">🧢 Meet the squad</button><button class=\"alt\" id=\"hhow\">📖 How to play</button><button class=\"alt\" id=\"hmus\">{3}</button></div>\n      </div></div>\n    <section class=\"hpaper\"><div class=\"ptabs\"><button class=\"ptab on\" id=\"tabEco\">📰 The Neighbourhood Echo</button><button class=\"ptab\" id=\"tabNov\">🆕 What's new</button></div>\n      <div id=\"hnews\"><div class=\"mast\"><b>THE NEIGHBOURHOOD ECHO</b><span>{4} · Orcasitas edition · {5}</span></div>\n        <div class=\"pcols\"><article class=\"plead\"><h3>{6}</h3><p>{7}</p></article>\n          <aside class=\"bole\"><div class=\"bhd\">YUYU'S OFFICIAL GAZETTE</div><p class=\"bnum\">Decree no. {8}</p><h4>{9}</h4><p>{10}</p><p class=\"bsign\">— His Excellency Yuyu</p></aside>\n          {11}</div></div>\n      <div id=\"hpatch\" hidden><div class=\"mast\"><b>WHAT'S NEW</b><span>The latest in The Reconquest of Orcasitas</span></div><div class=\"patch\">{12}</div></div>\n    </section></div>\n    <div class=\"ticker\"><span class=\"tlabel\">BREAKING</span><div class=\"tmove\"><div class=\"ttrack\">{13}{14}</div></div></div>", "<h2>{0} <span class=\"muted\" style=\"font-family:var(--body)\">· {1}</span></h2>\n      <p class=\"muted wline\">{2}: {3}-{4} de daño{5}. Movimiento {6}.{7}</p>\n      <p>{8}</p>\n      <div class=\"btns\">{9}</div>\n      {10}\n      {11}\n      {12}\n      <div class=\"btns\">{13}<button id=\"end\" {14}>Fin del turno</button></div>\n      <details class=\"pinfo\"><summary>Qué hace cada poder</summary><p class=\"muted\">{15}</p></details>": "<h2>{0} <span class=\"muted\" style=\"font-family:var(--body)\">· {1}</span></h2>\n      <p class=\"muted wline\">{2}: {3}-{4} damage{5}. Movement {6}.{7}</p>\n      <p>{8}</p>\n      <div class=\"btns\">{9}</div>\n      {10}\n      {11}\n      {12}\n      <div class=\"btns\">{13}<button id=\"end\" {14}>End turn</button></div>\n      <details class=\"pinfo\"><summary>What each power does</summary><p class=\"muted\">{15}</p></details>", "Toca dos veces la casilla marcada para mover a Adri": "Tap the marked tile twice to move Adri", "Toca dos veces la casilla marcada para mover a Safu": "Tap the marked tile twice to move Safu", "Mejor control en el móvil": "Better mobile controls", "Primer toque marca la casilla y el segundo mueve. Y si te equivocas, «Deshacer movimiento».": "First tap marks the tile, the second one moves. And if you slip up, «Undo move».", "Más fluido": "Smoother", "Menos tirones en las misiones y en el mapa, sobre todo en el móvil.": "Less stutter in missions and on the map, especially on mobile.", "Coste: 1 acción.": "Cost: 1 action.", "Carrera: gasta las 2 acciones.": "Sprint: uses both actions.", "Cobertura alta 🛡️": "High cover 🛡️", "Cobertura baja": "Low cover", "Sin cobertura": "No cover", "<h2>Mover a {0}</h2>\n      <p>{1} {2}</p>\n      <p class=\"muted\">Vuelve a tocar la casilla o pulsa «Mover aquí». Toca otra casilla para cambiar el destino.</p>\n      <div class=\"btns\"><button id=\"mgo\">Mover aquí</button><button class=\"alt\" id=\"cancel\">Cancelar</button></div>": "<h2>Move {0}</h2>\n      <p>{1} {2}</p>\n      <p class=\"muted\">Tap the tile again or press «Move here». Tap another tile to change the destination.</p>\n      <div class=\"btns\"><button id=\"mgo\">Move here</button><button class=\"alt\" id=\"cancel\">Cancel</button></div>", "<div class=\"btns\"><button class=\"alt\" id=\"undo\">↶ Deshacer movimiento de {0}</button></div>": "<div class=\"btns\"><button class=\"alt\" id=\"undo\">↶ Undo {0}'s move</button></div>", "{0} vuelve a donde estaba.": "{0} goes back to where they were.", "Lanzatuercas": "Nut launcher", "Lanzar tuerca": "Throw nut", "Tirafichas": "Pick-up liner", "Tirar ficha": "Drop a line", "Azote con correa de distribución": "Timing-belt whip", "Puma saca una correa de distribución del taller y azota a un esbirro a 2 casillas o menos: 3-4 de daño sin fallo y, si no es un sargento ni Yuyu, se queda K.O. un turno. Recarga 3 turnos.": "Puma pulls a timing belt out of the workshop and whips a henchman 2 tiles away or less: 3-4 damage that never misses and, unless it is a sergeant or Yuyu, it is knocked out for a turn. Recharges in 3 turns.", "¡Tuerca al casco!": "Nut to the noggin!", "Apretada al par justo.": "Tightened to spec.", "¡Tuerca del 13 en toda la frente!": "A size-13 nut right on the forehead!", "¡Ficha directa, compadre!": "Smooth line, compadre!", "Esa entra seguro.": "That one always lands.", "¡Correa de distribución, nene!": "Timing belt, baby!", "Esto se cambia cada 100.000 km… y tú también.": "You change these every 100,000 km… and you too.", "¡ZAS! Revisión completa.": "WHACK! Full service.", "correa": "timing belt", " y se queda K.O. un turno": " and is knocked out for a turn", "¡Azote con la correa de distribución! {0} recibe {1} de daño{2}.": "Timing-belt whip! {0} takes {1} damage{2}.", "{0} sigue dormido por el sermón de Yuyor.": "{0} is still asleep from Yuyor's sermon.", "{0} sigue aturdido por el «Estoy de Rodríguez».": "{0} is still stunned by «The wife's away!».", "¡ATURDIDO!": "STUNNED!", "{0} sigue dormido por el sermón y pierde el turno.": "{0} is still asleep from the sermon and loses the turn.", "{0} sigue aturdido y pierde el turno.": "{0} is still stunned and loses the turn.", "-1 acción": "-1 action", "{0} está cobrando el paro: solo tiene 1 acción este turno.": "{0} is on the dole: only 1 action this turn.", "CEGADO": "BLINDED", "SERMÓN": "SERMON", "ATURDIDO": "STUNNED", "EN EL PARO": "ON THE DOLE", "🐕 HIMA LE DEFIENDE": "🐕 HIMA GUARDS HIM", "¡ZAS!": "WHACK!", "<div class=\"eyebrow\">ZONA OCULTA DESCUBIERTA</div><h3>¡Yuyu se esconde en la Renfe de Orcasitas!</h3><p>Los vecinos se han chivado: Yuyu está en el andén del Cercanías. Allí ya no es Yuyu: es <b>YUYOR</b>, el jefe final, con su perra Hima, su máquina de café, su monitor OLED, sermones que duermen y la prestación por desempleo. Y si las cosas le van mal… «¡Estoy de Rodríguez!».</p><div class=\"btns\"><button class=\"red\" id=\"rfok\">¡A por él!</button><button class=\"alt\" id=\"rfno\">Más tarde</button></div>": "<div class=\"eyebrow\">HIDDEN ZONE FOUND</div><h3>Yuyu is hiding in Orcasitas Renfe station!</h3><p>The neighbours have grassed: Yuyu is on the commuter-train platform. There he is no longer Yuyu: he is <b>YUYOR</b>, the final boss, with his dog Hima, his coffee machine, his OLED monitor, sleep-inducing sermons and the unemployment benefit. And if things go badly for him… «The wife's away!».</p><div class=\"btns\"><button class=\"red\" id=\"rfok\">Get him!</button><button class=\"alt\" id=\"rfno\">Later</button></div>", "Zona oculta": "Hidden zone", "❓ ZONA OCULTA": "❓ HIDDEN ZONE", "Libera {0} zonas para descubrirla ({1}/{2})": "Free {0} zones to find it ({1}/{2})", "Yuyu se ha escondido en la zona oculta: la Renfe de Orcasitas. Allí le espera YUYOR, el jefe final, con su perra Hima, su máquina de café, su monitor OLED y vecinos convencidos por su populismo. Si cae, Orcasitas es libre.": "Yuyu is hiding in the hidden zone: Orcasitas Renfe station. YUYOR, the final boss, awaits you there with his dog Hima, his coffee machine, his OLED monitor and neighbours won over by his populism. If he falls, Orcasitas is free.", "Nadie sabe dónde se esconde Yuyu cuando las cosas se ponen feas. Dicen que tiene una guarida secreta en el barrio… Libera zonas y los vecinos acabarán chivándose.": "Nobody knows where Yuyu hides when things get ugly. They say he has a secret lair in the neighbourhood… Free zones and the neighbours will end up grassing.", "¡Hima, defiende a papá!": "Hima, defend dadd
